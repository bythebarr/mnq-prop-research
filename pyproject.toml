[project]
name = "mnq-research"
version = "0.1.0"
description = "Evidence-driven MNQ futures strategy research foundation (Phase 1: no strategy, no live trading)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    # Not used yet. Installed now so later phases (chronological validation,
    # diagnostics charts) do not change the environment mid-research.
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.scripts]
mnq = "mnq_research.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnq_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
