# --- Entry trigger ------------------------------------------------------------------------------------------------
entry_trigger:
  long_trigger: >
    The trigger event is the completed decision-bar close at which all three conditions are established: (1) the continuation bar closes and completes confirmation; (2) the resulting candidate passes trade geometry and wins deterministic selection; (3) every required decision-time eligibility check is typed CLEAR. That selected, fully eligible candidate is the trigger - not the earlier touch, acceptance, pullback, hold, or an intrabar price movement. Exactly 1.000 second after that decision timestamp, the system reruns the required submission-time checks; the market order is submitted only if they still all return CLEAR, otherwise the candidate becomes NOT_SUBMITTED and is terminal.
  short_trigger: The exact mirrored sequence of long_trigger (continuation close completing confirmation; candidate passes geometry and wins deterministic selection; all decision-time checks typed CLEAR; submission-time checks rerun at +1.000s; failure = NOT_SUBMITTED, candidate terminal).

# --- Order type ----------------------------------------------------------------------------------------------------
order_type:
  entry_order_type: MARKET - every entry is a market order, submitted exactly 1 second after the confirmation/decision-bar close, provided all safety checks are still CLEAR.
  entry_price_rule: >
    The confirmation close plus one adverse tick is the PLANNED/MODELLED entry price, not a price attached to the market order: long = confirmation close + 0.25 point; short = confirmation close - 0.25 point. The actual entry is whatever authoritative fill price the market produces, including modeled slippage. (This one adverse tick IS the section-16 entry slippage - see slippage.entry_ticks; it is never charged twice.)

# --- Order validity and cancellation -------------------------------------------------------------------------------
order_validity:
  time_in_force: 2.000 seconds measured from SUBMISSION. If no fill occurs within 2.000 seconds after submission, cancellation is requested and the unfilled quantity cannot be chased, replaced, or retried.
  cancellation_conditions:
    - 11:30:00 New York entry cutoff: cancel all remaining unfilled quantity immediately; an order scheduled for submission at or after 11:30 is never submitted
    - Directional-conflict halt: cancel the working entry and halt new entries for the date
    - Any eligibility or safety state becomes BLOCKED or UNKNOWN - including the news-entry-protection cutoff beginning, missing/stale data, lost order/position/account state, broker-platform disagreement, position mismatch, connection failure, emergency-flatten activation, or any other governing safety halt
    - Structural invalidation while the entry remains unfilled (per structural_invalidation.definition)
    - Expiry mechanics: at 2.000s after submission with no fill, cancellation is requested; unfilled quantity cannot be chased, replaced, or retried; a fill received while cancellation is pending remains a valid cancellation-race fill and creates real exposure; only an authoritative confirmed cancellation makes the order definitively dead
    - Partial fills: no separate partial-fill cancellation rule - a partial fill is real exposure and consumes the daily entry allowance; the remaining quantity follows the same lifecycle unless one of the conditions above cancels it or its two-second deadline arrives; if the fill itself is at/beyond invalidation, emergency flatten activates and the BLOCKED/UNKNOWN category cancels the remainder

# --- Structural invalidation ------------------------------------------------------------------------------------------
structural_invalidation:
  definition: >
    Judged on a completed five-minute decision-bar CLOSE, never a wick (a wick is handled by the protective stop; this identifies failure of the accepted market structure). Long: structurally invalidated when a completed five-minute bar closes at or below the zone's upper boundary U (price has closed back inside or through the zone after accepting above it). Short: structurally invalidated when a completed five-minute bar closes at or above the zone's lower boundary L. Equality qualifies as invalidation. Incomplete, missing, or untrusted bars cannot prove invalidation; they invoke the separate data-safety policy. Intrabar wicks into the zone do not trigger this by themselves.
  action: >
    If the entry order is still working: cancel its remaining quantity. If a position is open: submit the defined market structural-invalidation exit, cancel the protective target, reconcile the stop/OCO state, and halt further entries (any fill already consumed the daily allowance). Preserve the original structural stop; invalidation does not move or widen it. (Note: with a two-second entry lifetime, another five-minute bar normally cannot close while the entry is still working - the working-order branch is valid for completeness but effectively dormant under B0; the open-position branch is the operative one.)

# --- Stop placement ----------------------------------------------------------------------------------------------------
stop_placement:
  method: >
    Structural stop from the zone's FAR boundary (opposite the acceptance side), displaced by buffer_ticks: long reference boundary = zone lower boundary L, stop = L - 0.25; short reference boundary = zone upper boundary U, stop = U + 0.25. The resulting stop must fall on the MNQ tick grid, remains fixed after entry, and is never compressed or widened to accommodate position size.
  # The buffer is the complete one-tick displacement beyond the far boundary - nothing additional is added (no double-counting).
  buffer_ticks: 1
  minimum_stop_points: 4.00
  # Both limits are INCLUSIVE (exactly 4.00 and exactly 15.00 qualify), measured as the absolute distance from the planned entry price to the frozen structural stop. At one MNQ contract the permitted price risk is $8-$30 before slippage and commissions. These are conservative candidate guardrails, not claimed optimal; diagnostics must report excluded setups and test neighboring ranges (minimums 3-5, maximums 12-18) on unseen data before any B0 change.
  maximum_stop_points: 15.00
  # Skip the trade as STRUCTURAL_STOP_DISTANCE_OUTSIDE_LIMITS. Never compress, widen, or otherwise move the structural stop to make it qualify; no clipping exists in B0.
  trade_skipped_if_outside_limits: true

# --- Target placement ---------------------------------------------------------------------------------------------------
target_placement:
  method: >
    Zone-based, never a fixed R multiple. Long: the nearest eligible opposing zone above the planned entry. Short: the nearest eligible opposing zone below the planned entry. 1.50R is only the minimum planned reward-to-risk qualification gate: a candidate with less than 1.50R is skipped; the target is never moved to manufacture 1.50R. A farther zone is never substituted merely because it would produce a better R:R.
  parameters: >
    Long target = the nearest eligible opposing zone's lower boundary - 0.25 point (one tick before the zone). Short target = the nearest eligible opposing zone's upper boundary + 0.25 point. Merged zones are treated as one complete zone: use its outer near boundary and ignore individual component levels for target placement. No eligible zone ahead: no target substitution and no trade. Fill model (Batch 9): a target touch alone does NOT fill - price must trade one tick THROUGH the target (TRADE_ONE_TICK_THROUGH); once qualified, the exit is booked at the frozen target price with 0 ticks slippage and no price improvement.

# --- Position management ---------------------------------------------------------------------------------------------------
position_management:
  # One MNQ contract per trade for the frozen baseline backtest - strictly the RESEARCH quantity, not final deployment sizing. Deployment quantity remains evidence-derived (contracts = floor(allowed account risk / modeled risk per MNQ contract); below 1 = skip; never round up, force one contract, or compress the structural stop) and is NOT part of frozen B0.
  contracts_per_trade: 1
  # Sam's exact token (he wrote it as position_sizing.sizing_method; the YAML section is position_management). Every executable B0 research trade uses exactly 1 MNQ contract; the evidence-derived deployment formula must not affect B0 signals, trade selection, or backtest results.
  sizing_method: FIXED_ONE_CONTRACT_RESEARCH_ONLY
  # B0 enters exactly one contract and exits the entire contract via one of four normal paths: protective stop; protective target; structural-invalidation market exit; scheduled 12:00 New York market flatten (plus the news/safety emergency flatten override). No scaling in, planned partial exits, pyramiding, averaging, or re-entry. Partial entry fills remain operationally possible in the general engine, but at one contract any positive fill IS the full position.
  scaling_in_out: NONE
  breakeven_rule: NONE
  # Governing sentence for both breakeven_rule and trailing_stop_rule: the original structural stop remains fixed for the trade's entire life - never moved to breakeven, trailed, tightened, widened, or relocated to protect profit or restore a desired R:R.
  trailing_stop_rule: NONE
  # No duration-based holding limit: entries at 09:46 and 11:29 share the same 12:00 deadline. Normal exits: fixed stop, fixed target, structural-invalidation exit, scheduled 12:00 flatten; news/safety flatten is an emergency override. The Batch 4 wording '15:55 or earlier holiday-session flatten as backstop' is SUPERSEDED in part by Batch 5 Q2: the backstop is 15:55:00 (see session_flattening note) and early-close dates are ineligible, so no holiday-session backstop adjustment exists in B0.
  time_based_exit: 12:00_NEW_YORK_SCHEDULED_FLATTEN_ONLY

# --- Maximum trades per day -------------------------------------------------------------------------------------------------
daily_limits:
  max_trades_per_day: 1
  # Both limits derive from the one-filled-entry allowance (Batch 5 pack): any fill - full or partial, win or lose - ends entries for the date, so a second trade after a loss can never exist.
  max_losing_trades_per_day: 1
  # No dollar threshold can change B0 behavior because any positive fill already ends entry eligibility for the date; the backtest must still REPORT the complete realized daily loss including commissions and slippage. Deployment value remains UNRESOLVED_EVIDENCE_DERIVED_PENDING_PROP_RULE_MODEL - to be selected only after the tested loss distribution, stressed costs/slippage, Monte Carlo results and current Tradeify drawdown rules are incorporated; do not invent a dollar amount. Kept separate: allowed planned risk per trade (sizing input) vs realized daily loss stop (account-level circuit breaker) - related under a one-trade policy, not automatically the same number.
  daily_loss_stop_usd: NOT_APPLICABLE_B0_ONE_FILLED_ENTRY_LIMIT

# --- Re-entry policy ------------------------------------------------------------------------------------------------------------
reentry:
  allowed: "no"
  conditions: NOT_APPLICABLE
  # Re-entry is not allowed in B0 (Batch 4 Q3: no re-entry; Batch 5 pack: allowed = no, conditions/cooldown NOT_APPLICABLE).
  cooldown_minutes: NOT_APPLICABLE

# --- Session flattening ---------------------------------------------------------------------------------------------------------
session_flattening:
  no_new_entries_after: "11:30:00"
  # America/New_York; the flatten process is initiated at 12:00. NO YAML HOME: Sam's separate field emergency_flatten_backstop = 15:55:00 America/New_York does not exist in this YAML (see yaml-field-map.md). Its substance: the backstop covers FAILURES only (12:00 exit rejected/lost/unacknowledged; unknown order/position state; cancellation-race or late fill recreating exposure; broker position differing from recorded fills; connection/platform failure; residual exposure found on reconciliation). Exposure discovered after 12:00 is flattened IMMEDIATELY - the system never intentionally waits until 15:55; at 15:55 an independent watchdog rechecks the authoritative broker position and invokes emergency flattening if any exposure remains or flatness cannot be confirmed.
  flatten_all_by: "12:00:00"
  # Market governs ALL flatten paths: scheduled 12:00, news/safety, and the 15:55 watchdog emergency flatten. No limit, stop-limit, passive or discretionary order type for forced flattening. Shared failure protocol: verify authoritative position - submit market close for confirmed open quantity - reconcile fills and remaining exposure - retry per the frozen emergency process if still open - alert - cancel incompatible remaining orders - halt new entries. Never submit another flatten blindly if authoritative state already confirms flat.
  flatten_order_type: MARKET

# --- Same-bar (intrabar) ambiguity ----------------------------------------------------------------------------------------------
# A one-minute OHLC bar does not reveal whether its high or low came first.
# See docs/DATA_CONTRACT.md section "Intrabar ambiguity".
intrabar_ambiguity:
  # Sam's token names the general policy (intrabar_ambiguity_resolution: STOP_FIRST); this field is its YAML home. With only one-minute data, a bar reaching both stop and target books the STOP exit with modeled adverse stop slippage and applicable costs; the target is never awarded from unresolved ordering. Finer data may override only when it proves the actual sequence (see resolution_with_finer_data).
  stop_and_target_same_bar: STOP_FIRST
  entry_and_exit_same_bar: >
    The entry bar CAN produce an exit, asymmetrically conservative: if the entry minute reaches the stop, assume the stop was hit after entry and exit at the modeled stop fill; if it reaches ONLY the target, the target is NOT awarded (the target-reaching price may have occurred before entry) and the position remains open; if it reaches both, STOP_FIRST governs and the trade exits at the stop; if neither, the trade continues normally. Every entry-minute result stays flagged intrabar-ambiguous. Finer data may override only when it establishes the relevant price occurred after the authoritative/modelled entry fill.
  resolution_with_finer_data: >
    When finer data are complete, verified, correctly timestamped and cover the entire ambiguous interval, the finer-data sequence becomes the PRIMARY execution result for that trade (FINER_DATA_RESOLVED_PRIMARY) - for execution ordering, fills, MAE/MFE and post-entry exit occurrence ONLY; five-minute bars still produce all strategy decisions, and finer data must never retroactively alter signal, confirmation, direction or candidate selection. If finer data are missing, incomplete, unsynchronized or otherwise uncertain, the conservative one-minute result remains primary. Both versions are always preserved and reported (one-minute version = ONE_MINUTE_CONSERVATIVE_COUNTERFACTUAL), per affected trade: whether the exit outcome changed; stop/target/no-exit under each; fill time and price under each; gross and net P&L difference; net-R difference; MAE/MFE difference; which ambiguity caused the difference. Aggregate: number and percentage of trades changed, plus differences in win rate, expectancy, drawdown, losing streak and total net P&L. The conservative result is never deleted or silently overwritten; it remains the benchmark/stress case.

# --- Missing-data behaviour ------------------------------------------------------------------------------------------------------
missing_data:
  policy: DEPENDENCY-LEVEL POISONING (not whole-date rejection, not mere proximity filtering). Never synthesize, forward-fill, interpolate, or repair a missing expected bar. A verified no-trade minute is NOT a gap; a known outage or unexplained missing minute is. Any five-minute decision bar containing one or more missing expected one-minute bars is INCOMPLETE and unusable. Any level whose reference window includes the gap becomes unavailable; levels built from unaffected windows remain usable. A gap during an active approach, attempt, acceptance or confirmation invalidates that live sequence and resets the zone's live state (history remains logged). No decision or entry may use the incomplete interval; resumption only from complete bars through a completely fresh arm - attempt - acceptance - confirmation sequence. If the missing dependency leaves insufficient valid levels to evaluate structure, room, stop or target, the date naturally becomes non-tradable, but it is not rejected merely because an unrelated minute was absent. A gap while a position is open makes the trade unscorable in primary statistics plus a separately reported full-loss stress result (see open_position_during_gap); in live operation it invokes the data-safety and reconciliation/flatten policy. Total missing minutes per date are still reported for data-quality diagnostics with extreme outliers flagged for review, but totals never change B0 eligibility when every required dependency remains complete.
  # No separate whole-date numerical threshold exists in B0. Setting 0 would falsely imply one irrelevant missing minute rejects the whole date; that interpretation is explicitly removed.
  max_tolerated_gap_minutes: NOT_APPLICABLE_DEPENDENCY_BASED_POLICY
  open_position_during_gap: >
    Primary run: the TRADE (not the date) is excluded from primary performance statistics as UNSCORABLE_OPEN_POSITION_DATA_GAP; the date, earlier signals, eligibility history and diagnostic records remain intact; no later B0 trade can arise that date (the fill consumed the allowance). Stress run: book a COMPLETE structural-stop loss, not the worst surviving observed price - from the actual/modelled entry fill, exit at the frozen structural stop with applicable adverse stop-market slippage, charge the full round-trip commission, and produce the Batch 9 scenario set (base, 2x-slippage, 3x-slippage, 1.25x-commission, 1.50x-commission, combined worst case). The worst surviving observed price remains a diagnostic only - it cannot substitute for an exit because the missing interval may contain worse prices. Live handling: block new action, preserve confirmed protection, reconcile authoritative order/position/account state, flatten confirmed exposure through the market safety process, halt new entries for the date.

# --- Bad-data behaviour ------------------------------------------------------------------------------------------------------------
bad_data:
  policy: >
    The SAME dependency-based poisoning policy as missing_data: only corrupted dependencies are poisoned unless the corruption destroys confidence in the date as a whole. A corrupt one-minute bar is never repaired, rounded, substituted, or silently removed; the affected minute is marked unusable; any five-minute decision bar containing it becomes INVALID (distinct from missing-data INCOMPLETE); any reference-window level depending on it becomes unavailable; any active approach/attempt/acceptance/confirmation sequence touching it is invalidated and reset; an open trade touching it becomes unscorable plus the separate structural-stop full-loss stress treatment; unaffected portions of the date remain valid. The entire date is excluded ONLY when corruption prevents trustworthy date-wide interpretation (e.g. trading date, contract mapping, timestamp ordering/time zone, session assignment, or enough required dependencies cannot be established). Logging for every failure: trading date, contract, timestamp; raw record identifier/hash; failed contract rule and machine-readable reason code; original values, never rewritten; affected decision bar, reference window, levels, sequences, trades; final disposition token BAR_INVALID, DEPENDENCY_UNAVAILABLE, TRADE_UNSCORABLE, or DATE_EXCLUDED; plus data, code, calendar and specification hashes.
  handling_of_rejected_bars: >
    A rejected bar is never locally corrected, but an official vendor republication may be accepted as a NEW DATASET VERSION. Requirements: preserve the original raw file, rejected record, dataset hash, validation report and results permanently; obtain the replacement from the same authoritative vendor or another separately approved source; record retrieval time, source, request parameters, vendor file metadata and hashes; produce an exact diff identifying every added/removed/changed record; link the new dataset to the superseded dataset hash and state why replacement was accepted; validate the entire replacement independently - never patch the canonical file by hand; re-run every affected decision bar, level, sequence, trade and aggregate result; preserve earlier results as SUPERSEDED, never overwrite or delete; require a NEW STAGE APPROVAL because the data hash changed. If no authoritative corrected publication exists, the rejected bar remains rejected; internal interpolation, manual edits, rounding, or reconstruction from neighboring bars are never acceptable corrections.

# --- Commission assumptions ----------------------------------------------------------------------------------------------------------
commissions:
  # Per MNQ contract, entry $0.91 + exit $0.91 (the per-side figure is the arithmetic half of Tradeify's published $1.82 round-trip total). Base commission-and-fee assumption; modeled slippage is calculated separately and is NOT included in the $1.82.
  round_turn_per_contract_usd: 1.82
  # Yes - Tradeify states the $1.82 MNQ round-trip total includes exchange fees, NFA fees, clearing fees, and commissions; the $0.91 per side is all-in for those components and no trading-fee component is added elsewhere. Platform subscriptions, market-data charges, evaluation fees and account activation fees are outside per-trade P&L costs.
  includes_exchange_clearing_nfa_fees: true
  source_and_date: >
    Tradeify Help Center - 'Trading Commission Fees' (help.tradeify.co/en/articles/10468315-trading-commission-fees); source published/updated 2026-04-28; retrieved and verified 2026-11-03. Dated raw archive captured 2026-11-03 (raw page + retrieval metadata + extract + SHA-256 preserved in the cost-source archive; SHA-256 2f094d76d9f58489...): the archived wording matches the cited amount and inclusion, so the $1.82 stands as an ARCHIVED base assumption. If a future archived page differs from this wording or amount, that creates a new decision rather than silently changing the cost model.

# --- Slippage assumptions -------------------------------------------------------------------------------------------------------------
slippage:
  # This IS the Batch 3 one-adverse-tick modelled entry (long fill = confirmation close + 1 tick; short = confirmation close - 1 tick); additional base entry slippage = 0 ticks. Never charged twice. Stress scenarios measure TOTAL displacement from the confirmation close (base 1, 2x = 2, 3x = 3 - never stacked). If authoritative finer data provide an actual fill, use that fill and apply no modeled entry slippage.
  entry_ticks: 1
  # Base stop-market execution books one adverse tick beyond the frozen stop (long fill = stop - 0.25; short fill = stop + 0.25). Governs ordinary stop exits, STOP_FIRST ambiguous bars, entry-bar stop exits, and unscorable-trade full-loss stress booking. Stress uses 2 and 3 adverse ticks TOTAL. Commissions remain separate.
  stop_exit_ticks: 1
  # Target-limit slippage is 0 in every scenario. Fill test (no separate YAML field - see target_placement.parameters): TRADE_ONE_TICK_THROUGH - a touch alone never fills; once qualified, booked at the frozen target price, no price improvement, no adverse slippage.
  target_exit_ticks: 0
  # One base figure for EVERY market exit: 12:00 scheduled flatten, news flatten, safety flatten, structural-invalidation exit, protection-failure/emergency flatten, 15:55 watchdog flatten (long books one tick below the market reference price; short one tick above). Stress uses 2 and 3 adverse ticks total. No path-specific slippage in B0; the exit reason is preserved so diagnostics can later test whether emergency paths need a different model. Finer-data or live fills replace modeled slippage and are never adjusted twice.
  market_exit_ticks: 1
  # The formal six-scenario B0 set (Batch 9 Q8), defined HERE - it supersedes Batch 7 Q3's reference to the set as 'already defined' (it was not defined in the repo). No other cross-product combinations are required for B0. Multipliers scale TOTAL displacement, never stack on the base tick.
  stress_test_multipliers:
    - BASE: 1 adverse tick total on modeled entry, stop and market-exit fills; target-limit slippage 0; round-trip commission $1.82
    - SLIPPAGE_2X: 2 adverse ticks total on those modeled fills; target 0; commission $1.82
    - SLIPPAGE_3X: 3 adverse ticks total; target 0; commission $1.82
    - COMMISSION_1_25X: base slippage; round-trip commission $2.275
    - COMMISSION_1_50X: base slippage; round-trip commission $2.73
    - COMBINED_WORST_CASE: 3 adverse ticks total plus $2.73 round-trip commission - explicitly hypothetical, cannot overwrite the BASE result

# --- Prop-account rule version ----------------------------------------------------------------------------------------------------------
prop_account_rules:
  firm: Tradeify
  # Lifecycle (one label would be wrong - Select Daily is elected only AFTER passing the shared Select evaluation): evaluation_program = Tradeify Select 50K Evaluation; funded_program_election = Tradeify Select Daily Payout Policy - 50K Account; broker_connection = Rithmic (no separate YAML field exists for the broker). Do NOT call it a 'Select Daily 50K Evaluation' - that would wrongly apply funded rules (e.g. the $1,000 daily loss limit) to the evaluation. Source: dated capture of Tradeify's published rules, 2026-11-03, Sam-reviewed and approved for banking.
  program_name: Tradeify Select 50K Evaluation, electing the Select Daily Payout Policy for the funded 50K account after passing
  rules_document_version: NO_SINGLE_VERSIONED_DOCUMENT_PUBLISHED - Tradeify publishes no single versioned rules document; each Help Center article carries its own dateModified, preserved per page in the rules archive metadata (newest core pages, payout policies and pricing, modified 2026-11-02; Select Evaluation 2026-10-19; Daily Loss Limit 2026-10-17; drawdown 2026-10-15).
  # Dated capture: 18 official Tradeify pages, raw + metadata + SHA-256 + per-phase extracts, preserved in the Tradeify rules archive; reviewed and approved by Sam before banking.
  rules_retrieved_date: "2026-11-03"
  # $50,000 in both phases (Select 50K Evaluation; funded Select Daily 50K). No mismatch with the project brief's $50K.
  account_size_usd: 50000
  # EVALUATION-phase value. Published caveat: accounts purchased before the new dashboard launch retain their original $2,500 target, including on reset. FUNDED: no profit target; the funded account starts at the base $50,000 regardless of evaluation ending balance, and evaluation profits do not carry over. This is the firm's evaluation target - NOT the mandate's ~$17K payout objective, which is an evaluation scenario, not a target.
  profit_target_usd: 3000
  # SAME in both phases: a $2,000 trailing floor measured down from the highest end-of-day balance; a fresh 50K account's floor starts at $48,000.
  max_loss_limit_usd: 2000
  drawdown_type: >
    EOD TRAILING in both phases: the floor updates only at end of day off the highest end-of-day balance (high-water mark; moves up, never down) but is ENFORCED IN REAL TIME against net liquidation value including unrealised P&L; hard breach (account fails permanently). FUNDED-ONLY LOCK: at EOD balance $52,100 the floor fixes at $50,100, or immediately upon a payout request, whichever comes first; evaluations never lock.
  # EVALUATION-phase value: NONE (confirmed verbatim in the captured source). FUNDED (Select Daily, 50K): $1,000 initial - a SOFT breach (trading pauses until the next 6:00 PM ET session; the account does not fail; resets each session); at a $53,000 balance (6% profit) it increases to $2,000 (matching the drawdown) from the next session, for accounts purchased after Sep 12, 2025; legacy accounts purchased before that date have the DLL removed entirely at 6%.
  daily_loss_limit_usd: NONE
  # EVALUATION-phase value. FUNDED: starts at 2 mini / 20 micro, scaling with EOD equity - $51,500 -> 3 mini / 30 micro; $52,000 -> 4 mini / 40 micro maximum; tiers once reached are retained. Minis and micros combine at 10 micros = 1 mini, so the MNQ ceiling is 40 contracts in both phases at full scale. This caps DEPLOYMENT sizing; B0 research remains frozen at 1 contract.
  max_contracts: 40 micro / 4 mini (evaluation, full limit)
  # Caution preserved: the select-plan marketing page's gloss ('profitable on at least 40% of your trading days') does NOT match the Help Center rule; the Help Center wording governs.
  consistency_rule: >
    Evaluation only: 40% - no single day's profit (commissions excluded) may exceed 40% of total profits; exactly 40% passes; exceeding delays passing, it does not fail the account. An optional purchased add-on raises the limit to 50%. Funded: NONE.
  # EVALUATION-phase value: 3 trading days (a consequence of the 40% consistency rule; 2 days possible only with the 50% add-on). FUNDED Daily payouts: no minimum trading days between requests. Universal activity rule: at least 1 trade per week per account. A trading day = at least one trade placed in the 6:00 PM-5:00 PM ET session; on Rithmic, holiday half-days count but are recorded at the next full market close.
  minimum_trading_days: 3
  payout_rules: >
    FUNDED, Select Daily election (made after passing; permanent for that account): profit split 90% trader / 10% Tradeify. Buffer: $2,100 of profit must remain in the account. Amount: up to 2x the profit earned since the last payout, capped at $1,250 per payout for accounts purchased on/after Sep 1, 2026 ($1,000 before); minimum payout $250; only one open payout request at a time; each later cycle requires positive net cycle profit. Payout gate: over 50% of trades AND over 50% of profit must come from holds longer than 10 seconds (funded only). A payout request itself can trigger the drawdown lock (floor $50,100, never moves down). Payouts usually land within 24 hours once Rise onboarding is complete.
  trading_restrictions: >
    News trading unrestricted. All positions flat by 4:45 PM ET each trading day (12:59 PM on holiday shortened days); no overnight or weekend holding. HEDGING PROHIBITED: opposing positions on the same instrument or same Product Group (MNQ sits in the Equity Index group), in one account or across accounts - consequences include violation status, profit forfeiture, and possible permanent ban. COPY TRADING IS EXPRESSLY PERMITTED (captured verbatim): 'Can I trade the same instrument on more than one account? A: Yes, as long as the positions are in the same direction. Copy trading is permitted.' - so the mandate's three-identical-accounts structure does not collide with Tradeify's published terms on this point. Counterpoints: coordinating with OTHER traders (team trading, third-party management, prohibited trade-copying) is banned; bots must be solely owned and provable (the firm scans for similar orders on other accounts and may require a live video of the owner enabling the code), may not be used across multiple firms, and HFT is prohibited. Maximum 5 simulated funded accounts per user and per household. DCA, flipping and scaling are unrestricted; exploiting platform errors is prohibited.

