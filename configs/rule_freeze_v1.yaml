# =============================================================================
#  RULE FREEZE v1  --  STATUS: DRAFT_NON_EXECUTABLE
# =============================================================================
#  THIS FILE IS A BLANK TEMPLATE. IT CONTAINS NO ACCEPTED TRADING RULES.
#
#  * Every `TBD` or `null` is an unanswered question, NOT a default.
#  * The software refuses to treat this file as executable until:
#      1. every required field has an explicit answer,
#      2. specification.status is FROZEN_APPROVED, and
#      3. approval_record is complete and its approved_spec_hash matches
#         the content of this file (run: `uv run mnq rules check`).
#  * Plain-English explanations of every field are in docs/RULE_FREEZE_GUIDE.md.
#  * Write clock times in quotes, e.g. "09:30". Write "NONE" or
#    "NOT_APPLICABLE" when a field deliberately does not apply; never leave it
#    empty.
#  * The list of required fields lives in src/mnq_research/validation.py, so
#    deleting a field from this file does NOT make it pass validation.
# =============================================================================

specification:
  spec_id: MNQ-RULE-FREEZE
  version: "1.0-draft"
  status: DRAFT_NON_EXECUTABLE   # allowed: DRAFT_NON_EXECUTABLE | FROZEN_APPROVED
  strategy_name: "MNQ Objective Structure Continuation — Baseline 0 (MNQ-OSC-B0)"
  author: Sam Barr               # accountable rule owner
  # Recorded verbatim from the rule owner (Round 1, 2026-09-28). This is the
  # reference description only: it is NOT executable logic. Every judgement
  # word in it is tracked in docs/RULE_FREEZE_OPEN_TERMS.md until it has an
  # exact definition in the fields below.
  plain_english_summary: >
    The strategy waits until the opening volatility has had time to develop
    and the market presents a clear, objectively measurable
    structure-continuation opportunity around meaningful price levels. It
    trades only when price demonstrates defined acceptance beyond a
    structural level, followed by sufficient confirmation that continuation
    is more likely than immediate rejection, with adequate unobstructed room
    toward the next meaningful level. Direction is chosen from the developing
    market structure: longs require bullish structural progression and
    acceptance above the relevant level, while shorts require bearish
    structural progression and acceptance below it. The strategy enters
    through a predefined order method after the confirmation trigger, places
    its stop at the structural invalidation point rather than using an
    arbitrary fixed distance, and sizes the MNQ position from that stop
    distance and the permitted account risk. It exits at a predefined target
    located conservatively before the next meaningful opposing level, at
    structural invalidation, or at a mandatory session-closing time. It takes
    no trade when conditions are unclear, data are incomplete, execution
    assumptions are unsafe, or required risk constraints cannot be satisfied.
    The exact opening delay, eligible session, structural-level definitions,
    acceptance criteria, confirmation trigger, entry order, target method,
    maximum trades, news restrictions, daily loss limit and daily shutdown
    conditions remain to be defined during Rule Freeze v1.0.

# --- Instrument and contract selection ---------------------------------------
instrument:
  root_symbol: MNQ               # stated in the project brief
  # Round 5 answers (rule owner, 2026-09-28); CME: $2 x Nasdaq-100 Index, 0.25 tick
  name: Micro E-mini Nasdaq-100 Index Futures
  exchange: CME
  venue: CME Globex
  currency: USD
  tick_size_points: 0.25
  tick_value_usd: 0.50           # = 0.25 points x $2.00 per point (checked by the validator)
  point_value_usd: 2.00
  expiration_cycle: [March, June, September, December]
  contract_selection_method: >
    Trade the designated CME lead quarterly MNQ contract under a deterministic
    calendar-based roll rule. Before the frozen roll moment, use the nearest
    unexpired quarterly contract; from the roll moment, use the following
    quarterly contract. Never select a contract by looking back at which one
    ultimately had the greatest full-day volume (future information).

# --- Contract-roll method ------------------------------------------------------
contract_roll:
  roll_trigger: >
    CME customary U.S. equity-index roll date: the Monday preceding the third
    Friday of the March, June, September or December expiration month.
  roll_timing:
    switch_at: >
      Opening of the CME Globex trading session associated with the Monday
      roll date, normally Sunday 18:00:00 America/New_York. If a holiday or
      exchange schedule changes that opening, use the actual CME-published
      Globex session opening associated with that trade date.
    example: >
      Expiration Friday September 18; roll date Monday September 14. The old
      contract stays designated through the preceding Friday session; the new
      contract becomes designated at the Sunday 18:00 New York Globex open;
      Monday 09:45 trading uses the new contract.
    manifest: The applied roll timestamp and both contract symbols are stored in the data manifest.
    boundary_rules:
      - Never combine old-contract and new-contract prices in one OHLCV bar.
      - Reset any calculation that cannot validly cross the contract boundary.
      - Any later use of prior-day or overnight levels must separately define roll-week handling.
  price_series_adjustment: >
    Unadjusted individual contracts. No back-adjusted continuous series is
    used for execution testing. Contracts are joined only by the frozen roll
    rule, with every roll transition flagged so a contract change cannot
    generate an artificial signal.
  open_position_at_roll: >
    not applicable: the strategy is intraday and must be flat before the roll
    moment (enforced by session_flattening.emergency_flatten).

# --- Source data and required fields ------------------------------------------
source_data:
  # Round 2B answers (rule owner, 2026-09-28)
  vendor: Databento   # historical research data ONLY; never in the live order path
  dataset_name: >
    Databento GLBX.MDP3, schema ohlcv-1m, individual quarterly MNQ futures
    contracts (no back-adjusted continuous series), downloaded together with
    the instrument-definition and symbology data. The actual contract symbol
    and instrument ID are preserved on every row.
  base_bar_interval: 1min        # fixed by docs/DATA_CONTRACT.md
  vendor_timestamp_convention: >
    bar_start. Databento ts_event marks the start of the minute in UTC: a bar
    stamped 13:45:00 UTC covers trades from 13:45:00 inclusive to 13:46:00
    exclusive and may not be used for a decision before 13:46:00. Databento
    prints no bar for a minute with no trades.
  vendor_timezone: UTC
  history_start_date: 2019-05-06
  history_end_date: 2026-09-25   # last fully completed trading day before this spec was written
  higher_resolution_data_available: >
    yes. Databento trades and ohlcv-1s are available. The canonical
    strategy-decision dataset remains ohlcv-1m. Higher-resolution data is for
    execution validation, ambiguous same-minute stop/target ordering,
    slippage analysis and selected replay investigations. Its complete
    history is NOT downloaded automatically: cost must be estimated and
    approved first. Until the required segment is available, the frozen
    conservative same-bar ambiguity rule applies and every affected trade is
    flagged.
  required_fields:               # fixed by docs/DATA_CONTRACT.md
    - timestamp_utc
    - timestamp_exchange
    - trading_date
    - contract
    - instrument_id
    - open
    - high
    - low
    - close
    - volume
    - source
    - source_timezone
    - ingestion_timestamp_utc

# --- Time-zone policy ------------------------------------------------------------
timezone_policy:
  storage_timezone: UTC                 # fixed by docs/DATA_CONTRACT.md
  exchange_timezone: America/Chicago    # CME local time; fixed by docs/DATA_CONTRACT.md
  rule_timezone: America/New_York   # Round 2B: session rules use New York time
  dst_handling: >
    All rule times are fixed local times in the IANA zone America/New_York all
    year: 09:45 always means 09:45 New York time in both standard and
    daylight-saving time. Convert to UTC with the time-zone database rules for
    that date; never use a fixed UTC offset such as UTC-5.

# --- Session definitions -----------------------------------------------------------
sessions:
  # Round 3 answers (rule owner, 2026-09-28).
  # Entry-eligibility window:  09:45:00 <= new-entry decision time < 11:30:00  (America/New_York)
  trading_window_start:
    time: "09:45:00"
    timezone: America/New_York
    boundary: inclusive
    anchor: 09:30:00 America/New_York cash equity-market open (NOT the 18:00 Globex open)
    meaning: >
      New entries first become eligible at 09:45:00. The last completed bar
      available to the first eligible decision is the bar stamped 09:44:00
      (covers 09:44:00 to just before 09:45:00, available at 09:45:00). No
      signal may use any part of the still-forming 09:45 bar, and no entry
      order may be submitted before 09:45:00. This establishes eligibility
      only; it never forces a trade.
  trading_window_end:
    time: "11:30:00"
    timezone: America/New_York
    boundary: exclusive
    meaning: >
      No new position or re-entry may be initiated at or after 11:30:00. With
      five-minute decisions (decision_clock) the final new-entry decision is
      at 11:25:00. A position entered before the cutoff may remain open only
      under the separately defined exit and mandatory-flattening rules.
    cutoff_semantics:   # Round 4 (rule owner, 2026-09-28)
      limits: >
        new-entry order SUBMISSION and continued entry-order ELIGIBILITY, not
        merely signal generation
      at_cutoff:
        - No new entry order may be submitted.
        - Every unfilled or partially unfilled entry order is cancelled.
        - No remaining entry quantity may fill at or after 11:30:00.
        - Protective exit orders for an existing position remain active.
        - Exit and mandatory-flattening rules are governed separately.
      entry_counts_only_if: the fill occurs strictly before 11:30:00
      late_fill_treatment: >
        An order submitted before the cutoff whose fill would occur at or
        after 11:30:00 is ineligible and is treated as CANCELLED, not filled,
        in the backtest.
      latency: >
        A decision calculated before the cutoff does not qualify unless its
        entry order is also submitted before 11:30:00. Any specified
        calculation and submission latency (decision_clock.signal_to_order_delay)
        must be modelled; a decision made just before the cutoff can never
        produce an instantaneous earlier fill.
  # Round 8 (rule owner, 2026-09-28). All boundaries America/New_York with its
  # historical daylight-saving rules. Implemented in src/mnq_research/structural_levels.py.
  reference_windows:
    PRIOR_RTH:
      start: "09:30:00 inclusive"
      end: "16:00:00 exclusive"
      timezone: America/New_York
      bars: start-stamped one-minute bars 09:30 through 15:59
      prior_day_meaning: >
        The most recent previous NORMAL FULL 09:30-16:00 cash-session window,
        never the prior full Globex session. Closed exchange holidays are
        skipped. Scheduled early-close sessions cannot supply PRIOR_RTH
        levels: continue backward to the most recent normal full session. A
        Monday normally references the preceding Friday unless that Friday
        was closed or shortened, in which case continue backward.
      contract: >
        The specific quarterly MNQ contract designated for trading on the
        CURRENT strategy date, even if it was not yet the lead contract during
        the reference session (avoids an old-contract price discontinuity).
        That contract must have valid data for the entire required window,
        otherwise the affected prior-RTH levels are unavailable.
    OVERNIGHT:
      start: actual CME Globex session open associated with the current trade date, inclusive
      end: "09:30:00 America/New_York, exclusive"
      normal_start: 18:00:00 America/New_York on the preceding calendar date
      calendar: >
        Never assume 18:00 when CME publishes a different holiday or special
        opening; use the versioned CME session calendar. The window belongs to
        the current CME trade date, not the local calendar date.
      contract: >
        Only the quarterly MNQ contract designated for the current strategy
        date. Never combine overnight observations from two contracts.
      unavailable_when: >
        The session is absent, shortened, opened at an unverified time or
        contains a known acquisition outage. (Scheduled early-close current
        dates are already ineligible.)
    OPENING_RANGE:
      start: "09:30:00 inclusive"
      end: "09:45:00 exclusive"
      timezone: America/New_York
      bars: exactly the 15 start-stamped one-minute bars 09:30 through 09:44
      available_from: "09:45:00"
      contract: the MNQ contract designated for the current strategy date
      holidays: >
        The window does not change after a prior holiday; the current date must
        still be a normal full eligible session.
  early_close_handling: >
    Round 6: scheduled CME early-close sessions are NOT eligible for new
    strategy trades in Baseline B0; the normal 09:45-11:30 window is not run
    even if the market stays open past 11:30. The date is recorded as
    INELIGIBLE_SCHEDULED_EARLY_CLOSE. The exclusion uses only the calendar
    known before the session, never that day's price behaviour.

# --- Decision-clock timing ------------------------------------------------------------
decision_clock:
  decision_bar_interval:
    interval: 5min
    built_from: canonical one-minute bars (start-stamped, D-008)
    alignment: >
      Fixed America/New_York five-minute clock boundaries (09:30-09:35,
      09:35-09:40, 09:40-09:45, 09:45-09:50, ...). Alignment never depends on
      the historical file's first timestamp.
    membership_example: >
      The five-minute bar beginning 09:40 contains the one-minute bars
      stamped 09:40, 09:41, 09:42, 09:43 and 09:44, and is complete at 09:45.
  decision_point:
    rule: >
      New-entry decisions are made only after a five-minute bar has fully
      closed. The first eligible decision is at 09:45:00 using data through
      the completed 09:40-09:45 bar; the forming 09:45-09:50 bar is unavailable
      to it.
    eligible_new_entry_decision_times_ny: "09:45, 09:50, 09:55, ..., 11:25"
    no_decision_at: "11:30 (the entry window is end-exclusive)"
    last_decision_note: >
      A decision at 11:25 may create an entry order after the configured
      processing/submission latency; any unfilled remainder is cancelled at
      11:30:00.
    between_decisions: >
      Working orders and protective exits may be monitored continuously
      between decision times. The five-minute restriction applies only to
      generating NEW entry decisions, not to risk management or emergency
      order handling.
  signal_to_order_delay:
    value: 1.000 second from the five-minute decision-bar close to entry-order submission
    example: >
      Decision bar 09:40:00 to just before 09:45:00; decision time
      09:45:00.000; earliest submission 09:45:01.000; earliest possible fill is
      the first qualifying market event at or after 09:45:01.000. A fill at the
      09:45:00 opening trade is NOT permitted (it precedes submission).
    data_requirement: >
      Execution-grade testing requires Databento trades or one-second data
      around entries. A one-minute-only test may generate candidate signals
      but cannot claim precise execution at bar close + 1 second. Without
      higher-resolution data, flag the trade EXECUTION_AMBIGUOUS and use
      intrabar_ambiguity.fill_approximation_without_finer_data; never quietly
      assume a fill at the next minute's open.
    cutoff: If the submission time is at or after 11:30:00, the order is not submitted.
    status_note: >
      Conservative initial engineering assumption, NOT an optimised trading
      parameter. Forward testing must measure actual Quantower-to-Rithmic
      timing and stress-test longer delays without tuning them for profit.
  bar_aggregation_rule:
    decision_eligible_only_if: all five expected one-minute component bars are present and valid
    never: [forward-fill absent minutes, fabricate zero-volume bars, build a decision bar from fewer than five components]
    record_per_interval:
      - expected one-minute timestamps
      - present component count
      - missing timestamps
      - component validation status
      - final five-minute decision eligibility
    one_to_four_components_present: >
      OHLCV may be calculated and kept for diagnostics only; the bar is marked
      INCOMPLETE_NOT_DECISION_ELIGIBLE and cannot generate a new signal or
      satisfy a multi-bar setup.
    zero_components_present: >
      No synthetic OHLCV. Record an explicit NO_TRADES_OR_DATA_FOR_INTERVAL gap
      record and mark the interval ineligible.
    dependent_calculations: >
      Any indicator, market-state measurement or structural calculation that
      requires an incomplete bar is unavailable unless its own specification
      explicitly defines otherwise. The system fails closed: uncertainty
      produces no new trade.

# --- Eligible trading dates ---------------------------------------------------------------
eligible_trading_dates:
  # Round 6 answers (rule owner, 2026-09-28)
  allowed_weekdays: [Monday, Tuesday, Wednesday, Thursday, Friday]
  eligibility_rule: >
    A weekday is eligible only if CME publishes a normal full equity-index
    futures session for it and none of the exclusions below applies.
  holiday_and_half_day_policy:
    exchange_holidays: >
      No trading on a date when the relevant CME equity-index futures session
      is closed. Eligibility is never inferred from the presence of a few
      overnight records.
    early_close_days: No trading on scheduled CME early-close sessions (INELIGIBLE_SCHEDULED_EARLY_CLOSE).
    holiday_adjacent_days: >
      A normal full session immediately before or after a holiday remains
      eligible, tagged PRE_HOLIDAY_NORMAL_SESSION or
      POST_HOLIDAY_NORMAL_SESSION for diagnostics. These dates are not
      excluded merely because performance looks weaker unless a later change
      passes the full anti-overfitting process.
  roll_week_policy: >
    The designated Monday contract-roll date is ineligible for new trades in
    Baseline B0 (INELIGIBLE_ROLL_DATE). Tuesday to Friday of roll week remain
    eligible if they otherwise have normal full sessions; every eligible date
    in roll week is tagged ROLL_WEEK.
  calendar_source:
    source: Official CME Group Holiday and Trading Hours calendar for the relevant historical year and product category (https://www.cmegroup.com/trading-hours.html)
    reason: CME holiday hours can change and may not be final until about two weeks before the holiday, so the actual dated schedule used must be preserved.
    artifact_per_year:
      - source URL
      - retrieval timestamp
      - source publication/update date when available
      - file hash
      - applicable products
      - session date
      - published open
      - published close
      - classification (normal, closed or early close)
      - special notes
    immutability: >
      A historical calendar file is never silently replaced after experiments
      are registered; a revision creates a new calendar version and hash.

# --- News-event policy ----------------------------------------------------------------------
news_events:
  # Round 7 answers (rule owner, 2026-09-28)
  policy:
    summary: >
      Scheduled-news blackout policy, stricter than Tradeify's currently
      published requirements. Scheduled events do NOT make the whole trading
      date ineligible; they create blackout intervals.
    during_blackout:
      - No new entry decision may generate an order.
      - No new entry order may be submitted.
      - All unfilled entry orders are cancelled.
      - Any open strategy position must be closed before the blackout begins.
      - Risk-management and emergency-flatten logic remain active.
    pre_window_events: >
      An event before the 09:45 strategy window is still recorded and tagged,
      even if its blackout has ended by 09:45.
    unscheduled_news: >
      Cannot be pre-scheduled. Handled through stops, slippage modelling,
      volatility diagnostics and account-level circuit breakers, never by
      fabricated historical blackouts.
    day_tags: [MINUTES_SINCE_LAST_TIER_1_EVENT, TIER_1_EVENT_OCCURRED_BEFORE_CASH_OPEN, TIER_1_EVENT_OCCURRED_TODAY]
    unverified_calendar_dates: >
      A date whose news schedule cannot be verified from an archived source is
      marked NEWS_CALENDAR_UNVERIFIED and is ineligible for baseline trading
      until resolved.
  event_types:
    tier_1_events:   # ONLY these create automatic B0 blackouts (U.S. scheduled releases)
      - BLS Employment Situation, including Nonfarm Payrolls
      - Consumer Price Index
      - Producer Price Index
      - FOMC monetary-policy statement and rate decision
      - FOMC Chair press conference
      - BEA Personal Income and Outlays, including PCE inflation
      - "BEA GDP releases: advance, second and third estimates"
      - Advance Monthly Sales for Retail and Food Services
      - ISM Manufacturing PMI
      - ISM Services PMI
      - Job Openings and Labor Turnover Survey
      - Initial Unemployment Insurance Claims
      - Conference Board Consumer Confidence
      - University of Michigan Consumer Sentiment, preliminary and final
      - Advance Report on Durable Goods
      - Scheduled Federal Reserve Chair monetary-policy testimony to Congress
    context_only: >
      Other speeches, regional surveys, Treasury auctions, company earnings
      and ordinary Federal Reserve official appearances may be recorded as
      contextual tags but do not create a B0 blackout.
    change_control: >
      Event classes are never added or removed based on observed backtest
      profitability without a registered rule-change hypothesis validated out
      of sample.
    releases_at_0830: >
      Included in the calendar and tagging. Their standard blackout ends
      before 09:45 (e.g. event 08:30, blackout 08:15 to 09:00), so they do not
      by themselves prevent a 09:45 entry.
  blackout_minutes_before: 15
  blackout_minutes_after: 30
  # Round 7b (rule owner, 2026-09-28): additional to the 15-minute blackout.
  entry_protection_buffer_before_blackout_minutes: 15
  entry_protection_buffer:
    new_entry_block_begins: scheduled event time - blackout_minutes_before - entry_protection_buffer_before_blackout_minutes
    rules:
      - No new entry decision may produce an order from 30 minutes before a point-in-time Tier 1 event.
      - Existing positions may continue under their normal stop and target until the scheduled news-flatten procedure begins.
      - The news-flatten procedure begins 1 minute before the formal blackout boundary.
      - The account must be confirmed flat by the formal blackout boundary.
      - A setup that forms during the entry-protection buffer is invalidated and cannot be resumed after the event.
    example: "event 11:00 -> new-entry block from 10:30 -> formal blackout from 10:45 -> news-flatten begins 10:44 -> flat by 10:45"
    purpose: >
      Prevents opening a position that is almost immediately force-closed
      solely because a known event is approaching.
  blackout_interval:
    definition: "[scheduled time - 15 minutes, scheduled time + 30 minutes): start inclusive, end exclusive"
    reentry: >
      After a blackout, acceptance, confirmation and the entry trigger must
      form fresh from completed post-blackout five-minute bars. A five-minute
      bar that overlaps any part of the blackout cannot participate, so the
      earliest possible post-blackout decision is at the close of the first
      five-minute bar that lies entirely at or after the blackout end.
    example: >
      event 10:00 -> new-entry block from 09:30 -> formal blackout 09:45 <= t
      < 10:30 -> first fully post-blackout five-minute bar 10:30-10:35 ->
      earliest possible fresh decision 10:35 (only if a complete fresh setup
      exists then). No entry is possible before this event because the
      strategy window starts at 09:45.
    correction_note: >
      Round 7b supersedes the Round 7 example that allowed a decision at
      10:30; at 10:30 no completed post-blackout decision bar exists yet.
    frequency_note: >
      The reduced opportunity on 10:00-release days is intentional. It is not
      relaxed to increase frequency. Later testing must report how many
      candidate sessions and trades the policy removes; any change must be
      justified by market behaviour and validated out of sample.
    overlaps: >
      Overlapping blackouts are merged (e.g. FOMC decision 14:00 and press
      conference 14:30 -> one blackout 13:45 to 15:00).
    state_reset_at_blackout_start:
      - Invalidate all pending setup state.
      - Cancel all unfilled entry orders.
      - Reset acceptance and confirmation counters.
      - Clear pending triggers and entry eligibility.
      - Preserve only independently defined structural reference levels that remain valid under their own rules.
    duration_events:   # Round 7b: scheduled Federal Reserve Chair monetary-policy testimony
      applies_to: Scheduled Federal Reserve Chair monetary-policy testimony to Congress
      reason: Testimony and questioning can continue for hours, unlike a point-in-time release.
      with_official_scheduled_end: "blackout = [scheduled start - 15 minutes, scheduled end + 30 minutes)"
      without_reliable_scheduled_end: >
        If the testimony begins before the 11:30 new-entry cutoff, block new
        entries for the remainder of the strategy's trading window.
      never: >
        Invent an end time from when a recording, transcript or news report
        later ended.
      record: the source and whether an official scheduled end was available
  open_position_during_event:
    rule: The strategy may not intentionally carry an open position into a Tier 1 blackout.
    at_blackout_start:
      - Disable new entries.
      - Cancel every working entry order.
      - If a position remains open, submit the normal controlled news-flatten order.
      - Require flat confirmation.
      - If closing fails, invoke the emergency-flatten failure-handling state machine.
      - Preserve confirmed protective orders until flat status is established.
    flatten_start: >
      Begin the news-flatten procedure 1 minute before the blackout start
      (allowing for the modelled 1-second submission delay); the account must
      be confirmed flat no later than the blackout start. Example: 10:00 event,
      09:45 blackout start -> begin closing at 09:44, flat by 09:45.
    order_type: market (avoiding uncontrolled release risk outranks exit price)
    exit_reason: SCHEDULED_NEWS_FLATTEN
  calendar_source:
    official_publishers:
      - "Bureau of Labor Statistics: Employment Situation, CPI, PPI, JOLTS"
      - "Bureau of Economic Analysis: Personal Income and Outlays/PCE, GDP"
      - "Federal Reserve: FOMC decisions, press conferences, Chair testimony"
      - "U.S. Census Bureau: Retail Sales, Durable Goods"
      - "U.S. Department of Labor: Initial Unemployment Insurance Claims"
      - "Institute for Supply Management: Manufacturing and Services PMI"
      - "The Conference Board: Consumer Confidence"
      - "University of Michigan Surveys of Consumers: preliminary and final sentiment"
    record_fields: [event_id, event_name, event_category, scheduled_timestamp_utc, scheduled_timestamp_new_york, scheduled_end_timestamp_utc, official_scheduled_end_available, publishing_organization, source_url, source_publication_or_calendar_date, calendar_retrieval_timestamp_utc, calendar_file_hash, schedule_revision_status, notes]
    time_basis: >
      The release time scheduled in advance, never the time a website was
      later scraped or the time the market first reacted.
    artifact: >
      A normalised, dated, hashed calendar file; raw source files or
      snapshots preserved where licensing permits; never silently rewritten
      after experiments are registered.
    third_party_providers: >
      May assist with discovery or cross-checking but can never be the sole
      authoritative source when an official publisher's schedule exists.

# --- Setup definition -----------------------------------------------------------------------------
setup:
  definition: TBD
  preconditions: TBD
  setup_expiry: TBD

# --- Direction rules ----------------------------------------------------------------------------------
direction:
  long_conditions: TBD
  short_conditions: TBD
  conflict_resolution: TBD

# --- Structural level definitions -------------------------------------------------------------------------
structural_levels:
  # Round 8 answers (rule owner, 2026-09-28). A deliberately small set of
  # objective, reproducible levels derived from price and time only.
  level_types:
    - PRIOR_RTH_HIGH
    - PRIOR_RTH_LOW
    - PRIOR_RTH_CLOSE
    - OVERNIGHT_HIGH
    - OVERNIGHT_LOW
    - OPENING_RANGE_HIGH
    - OPENING_RANGE_LOW
  excluded_from_b0:   # only via the registered rule-change process
    - discretionary support/resistance
    - manually drawn levels
    - volume profile levels
    - VWAP
    - moving averages
    - Fibonacci levels
    - detected supply/demand zones
    - prior swing highs or lows
    - machine-learning-generated levels
  calculation_method:
    source: >
      Canonical one-minute bars for all seven levels; never resampled
      five-minute highs, lows or closes.
    PRIOR_RTH_HIGH: maximum high across valid one-minute bars in the PRIOR_RTH window
    PRIOR_RTH_LOW: minimum low across valid one-minute bars in the PRIOR_RTH window
    PRIOR_RTH_CLOSE:
      rule: close of the final valid one-minute bar in the PRIOR_RTH window (normally the 15:59 bar)
      fallback: >
        If the 15:59 bar is absent solely because Databento confirms no trade
        occurred, use the last observed trade-bar close before 16:00 only when
        it is no more than five minutes old; record the source timestamp and
        staleness. If no valid closing observation exists from 15:55 through
        just before 16:00, PRIOR_RTH_CLOSE is unavailable.
    OVERNIGHT_HIGH: maximum high across valid one-minute bars in the OVERNIGHT window
    OVERNIGHT_LOW: minimum low across valid one-minute bars in the OVERNIGHT window
    OPENING_RANGE_HIGH: maximum high across the 15 required OPENING_RANGE one-minute bars
    OPENING_RANGE_LOW: minimum low across the 15 required OPENING_RANGE one-minute bars
  missing_data_treatment:
    minute_statuses: [VERIFIED_NO_TRADE_MINUTE, KNOWN_DATA_OUTAGE, UNEXPLAINED_MISSING_MINUTE]
    classification: >
      A minute Databento omitted because no trade occurred is not automatically
      a data-acquisition failure; ingestion must distinguish the three statuses
      where possible.
    prior_rth_and_overnight_high_low: >
      A verified no-trade minute does not invalidate the level (an omitted
      trade could not set a new high or low). A known data outage or
      unexplained missing interval makes the affected level unavailable.
      OHLC prices are never forward-filled.
    opening_range: >
      All 15 expected one-minute bars are required. Any absent, invalid or
      unverified component minute makes BOTH opening-range levels unavailable
      and the date ineligible for new entries.
    five_minute_relationship: >
      Levels are calculated independently from one-minute data, so an
      incomplete five-minute decision bar never retroactively alters a
      correctly calculated level. At a decision time every required level
      must be available AND every required five-minute decision bar complete;
      passing one never excuses failing the other.
  price_validation:
    - Be a finite positive number.
    - Align to the MNQ 0.25-point tick.
    - Derive only from data available by the relevant decision time.
    - Preserve its source window, source contract and calculation timestamp.
    - Preserve the identifiers or manifest reference of its component data.
    - Opening-range levels cannot exist before 09:45.
  level_expiry:
    scope: all seven levels are created for one current strategy trade date
    new_entries: expire for new-entry purposes at 11:30:00 America/New_York
    open_position: >
      For a position validly entered before 11:30, its frozen entry-time
      levels remain available for management, stop and target
      interpretation and audit until the position closes.
    complete_expiry: >
      At the earlier of (1) confirmation that the current position is flat
      after the final trade, or (2) the 15:55 emergency-flatten boundary.
    persistence: >
      A touch, temporary breach, rejection or accepted break never deletes a
      level. The original price is kept with a chronological state history
      (states untouched, approached, touched, breached, rejected, accepted
      above, accepted below; transitions defined in a later round, NOT in
      Round 8). No expiry after a number of touches. A frozen daily level is
      never moved, redrawn or recalculated; the opening range freezes at
      09:45 and never expands.
  level_proximity_tolerance:
    formula: >
      prior_rth_range = PRIOR_RTH_HIGH - PRIOR_RTH_LOW;
      raw = fraction_of_prior_rth_range x prior_rth_range;
      tolerance = clamp(raw, minimum_points, maximum_points), then rounded
      UP to the next valid 0.25-point tick.
    parameters:   # candidate B0 values, NOT universal market truths; not optimised
      fraction_of_prior_rth_range: 0.02
      minimum_points: 2.00
      maximum_points: 10.00
    examples: "range 75 -> raw 1.50 -> 2.00; range 300 -> 6.00 -> 6.00; range 700 -> 14.00 -> 10.00"
    unavailable: If the prior-RTH range is unavailable or invalid, the tolerance is unavailable and the date is not eligible for new entries.
    robustness: >
      Later robustness testing must examine neighbouring values and show
      acceptable results occupy a broad parameter region; a result that
      depends on one exact tolerance is evidence against robustness.
  clustering_method:
    steps:
      - Sort all available structural levels from lowest to highest price.
      - Put adjacent levels in the same cluster when the gap between them is <= the daily proximity tolerance.
      - Apply transitively (A-B and B-C within tolerance => A, B, C together even if A-C is not).
    preserve_per_cluster: [cluster_id, lower_boundary (minimum constituent price), upper_boundary (maximum constituent price), representative_price (median constituent price), constituent level types, constituent prices, source windows, source contract, creation time]
    identities: Never average constituent prices and discard their identities.
    single_level: An isolated level is a valid one-level cluster whose boundaries and representative price are identical.
  decision_use:
    zone_rule: >
      Later acceptance, rejection, confirmation, stop and target rules operate
      on the cluster as a zone, never treating nearby levels as independent
      opportunities.
    conservative_distances:
      - A long approaching resistance from below measures to the cluster's lower boundary.
      - A short approaching support from above measures to the cluster's upper boundary.
      - Invalidation that requires price to move completely beyond a cluster uses the far boundary.
      - Never use the representative median where it would make room-to-target or risk look more favourable.
    not_yet_defined: acceptance, confirmation, entry, stop and target rules (later rounds)

