# --- Maximum trades per day -------------------------------------------------------------------------------------------------
daily_limits:
  # D-029 decision 4 (rule owner, 2026-09-29): candidate B0 account-safety
  # parameter, NOT a claim that one trade per day is optimal.
  max_filled_entries_per_trading_date: 1
  filled_entry_allowance_rule: >
    Any positive confirmed filled quantity (full fill, partial fill,
    cancellation-race fill, fill confirmed without acknowledgement, or a
    reconciled open position caused by the strategy entry) sets
    daily_entry_allowance_consumed: true and the terminal daily state
    FILLED_ENTRY_LIMIT_REACHED. It keeps blocking after the position closes.
    Diagnostic signals may still be logged without orders; they can never
    become B0 trades. A NOT_SUBMITTED order does not use the allowance.
  max_trades_per_day: 1   # D-030 confirmed; = max_filled_entries_per_trading_date
  trade_definition: >
    D-030: a "trade" is a strategy-generated entry with any positive
    authoritative fill. Candidate generation, candidate rejection,
    NOT_SUBMITTED, an explicitly rejected entry with zero fill and a
    cancelled entry with zero fill do not consume the allowance. Any positive
    authoritative fill consumes it permanently for the trading date.
  max_losing_trades_per_day: NOT_APPLICABLE_BECAUSE_MAX_FILLED_ENTRIES_IS_ONE
  daily_loss_stop_usd: TBD

# --- No-trade conditions (added Round 2) -------------------------------------------------------------------
no_trade_conditions:
  execution_safety_conditions: >
    Round 15 / D-033 confirmed: every required producer returns CLEAR,
    BLOCKED or UNKNOWN; missing, malformed or UNKNOWN state blocks entry. The
    typed producers listed in
    execution_eligibility_integration.simulated_producers_required (session,
    news, data validity, position state, daily filled-entry allowance,
    directional-conflict halt, structural-stop validity, candidate validity,
    protection lifecycle, entry/exit cutoff, calendar availability). Any
    UNKNOWN blocks the simulated action.
  risk_constraint_conditions: TBD

# --- Re-entry policy ------------------------------------------------------------------------------------------------------------
reentry:
  # D-029 decision 4: no re-entry after a stop, target, manual safety exit or partial fill.
  allowed: false
  conditions: NOT_APPLICABLE
  cooldown_minutes: NOT_APPLICABLE

# --- Session flattening ---------------------------------------------------------------------------------------------------------
session_flattening:
  no_new_entries_after: "11:30:00 America/New_York (see sessions.trading_window_end cutoff_semantics)"
  flatten_all_by: "12:00:00 America/New_York (position_management.normal_flatten_time; 15:55 remains the emergency backstop)"
  flatten_order_type: MARKET
  emergency_flatten:   # Round 5: account-safety backstop, NOT a profit-management target
    time: "15:55:00"
    timezone: America/New_York
    applies: every eligible trading day
    purpose: >
      No position may be carried through the 17:00-18:00 New York maintenance
      interval, overnight, across a weekend or across a contract-roll
      boundary. The normal strategy should exit substantially earlier.
    actions:
      - Cancel all working entry orders.
      - Cancel or replace working exits as needed.
      - Submit the configured emergency position-closing order.
      - Confirm that the account is flat.
      - Escalate any rejected or unconfirmed flatten order through the failure-handling process.
    early_close_days:
      time_rule: earlier of 15:55:00 America/New_York and (published CME close - 20 minutes)
      example: published close 13:15 -> emergency backstop 12:55 New York
      close_source: the saved, dated CME calendar artifact (never a hard-coded list)
      reason: new entries are disabled on early-close days, but an unexpected carried or erroneous position must still be protected
    order_type:
      type: market (account protection, not price improvement)
      pre_submission_steps:
        - Disable all new entries for the account.
        - Cancel all working entry orders.
        - Query the current position and working orders.
        - Cancel or replace conflicting exit orders as needed.
        - Submit a uniquely identified market closing order for the CONFIRMED remaining position quantity.
      never: blindly resend a market order while position state is unknown (duplicate closes could reverse the position)
    failure_handling:
      state_machine:
        - Submit the initial emergency market-close order.
        - Wait up to 2 seconds for acknowledgement and updated position state.
        - If explicitly rejected but the remaining position is positively confirmed, submit another market-close order for only the confirmed remaining quantity.
        - At most 3 total submission attempts, at least 2 seconds apart, each preceded by a fresh position query.
        - Alert immediately after the first rejection or failure to confirm flat.
      after_third_failure_or_unreliable_state:
        - Keep the strategy halted.
        - Submit no new entries for the rest of the trading day.
        - Preserve any confirmed server-side protective stop; do not cancel protection blindly.
        - Raise a critical alert requiring manual inspection through R|Trader/Quantower.
        - Record the event as an operational safety failure.
      backtest_treatment: >
        In a normal historical backtest the emergency market order uses the
        frozen market-order fill model. In a failure/stress simulation a
        successful flatten is never fabricated: if flat status cannot be
        established, the path is marked UNRESOLVED_POSITION_CONTROL_FAILURE
        and, for conservative prop-survival calculations, counts as an
        account-survival failure unless later modelled market events
        establish an actual exit.

# --- Same-bar (intrabar) ambiguity ----------------------------------------------------------------------------------------------
# A one-minute OHLC bar does not reveal whether its high or low came first.
# See docs/DATA_CONTRACT.md section "Intrabar ambiguity".
intrabar_ambiguity:
  # Round 14 (rule owner, 2026-09-29); full rules in protective_orders.same_bar_ambiguity.
  stop_and_target_same_bar: >
    Both reachable within one minute and no finer chronology -> assume the
    stop first, fill with the conservative stop-fill model, mark
    SAME_BAR_STOP_TARGET_AMBIGUITY and CONSERVATIVE_STOP_FIRST.
  entry_and_exit_same_bar: >
    Round 15: only market events at or after the authoritative entry-fill
    timestamp may trigger the stop or target. Finer chronological data are
    used when they establish order (source reference kept). With one-minute
    data only: apply the conservative modelled entry fill; if the stop is
    reachable after an unresolved entry sequence assume stop first; never
    award a target from unresolved ordering; mark
    SAME_MINUTE_ENTRY_EXIT_AMBIGUITY and CONSERVATIVE_STOP_FIRST. A modelled
    entry at or beyond invalidation uses the entry-invalidation flatten.
  resolution_with_finer_data: >
    One-second or trade data that establish the order are used
    chronologically, keeping the higher-resolution source reference. If the
    finer interval itself is still ambiguous, stop-first remains the fallback.
  fill_approximation_without_finer_data:
    applies_to: marketable entry orders submitted during a minute when only one-minute OHLCV is available
    long_entry_fill: minute high + adverse slippage (slippage.entry_ticks)
    short_entry_fill: minute low - adverse slippage (slippage.entry_ticks)
    rounding: adversely to the valid MNQ tick
    flags: [CONSERVATIVE_ONE_MINUTE_FILL, HIGH_INTRABAR_UNCERTAINTY, REQUIRES_FINER_DATA_REPLAY]
    limitation: >
      Cannot be used to demonstrate precise execution quality or to promote
      the system to paper/live trading.
    limit_and_stop_limit_orders: >
      Need separate order-specific fill rules. A touched limit price is never
      assumed filled. Until the entry order type and its fill model are
      frozen, such trades are execution-incomplete.

# --- Missing-data behaviour ------------------------------------------------------------------------------------------------------
missing_data:
  # Round 15 (rule owner, 2026-09-29).
  policy: >
    When flat: verified Databento no-trade omissions follow the aggregation
    rules. A known acquisition outage or unexplained missing required data ->
    no signal, reset the affected setup state, the affected decision interval
    is ineligible, and a completely fresh setup is required after validity
    resumes. If required daily levels or calendars cannot be built reliably,
    the entire trading date is ineligible.
  max_tolerated_gap_minutes: 0   # D-033 confirmed: applies to unexplained missing minutes AND known outages
  verified_no_trade_minutes: >
    A minute positively verified as having no trades is NOT a data gap; it
    stays explicitly classified VERIFIED_NO_TRADE_MINUTE, never MISSING or
    OUTAGE.
  open_position_during_gap: >
    OPEN_POSITION_DATA_GAP_UNRESOLVED: never invent an exit or award a target;
    never silently drop the trade; exclude it from primary win/loss
    statistics; keep entry, stop, target and the last valid observation;
    mark the trade unscorable and report it in data-quality statistics;
    block promotion if unresolved open-position gaps are material. A separate,
    labelled account-survival stress scenario assigns each such trade a full
    -1R loss plus stop costs and slippage; never substituted into the primary
    baseline.

# --- Bad-data behaviour ------------------------------------------------------------------------------------------------------------
bad_data:
  # Round 15 (rule owner, 2026-09-29).
  policy: >
    Impossible OHLC, off-tick prices, wrong contract, conflicting duplicate
    authoritative timestamps, time-zone ambiguity or invalid session mapping
    fail the affected interval closed. Prices are never repaired silently.
  handling_of_rejected_bars: >
    Treated as missing required data: the interval is ineligible; if the bar
    is needed for a structural level, the date is ineligible; during an open
    trade -> OPEN_POSITION_DATA_GAP_UNRESOLVED.

# --- Commission assumptions ----------------------------------------------------------------------------------------------------------
commissions:
  # Round 15 (rule owner, 2026-09-29): a versioned EXTERNAL assumption; it may change.
  round_turn_per_contract_usd: "1.82"
  per_side_per_contract_usd: "0.91"   # charged for every entered and every exited contract side
  includes_exchange_clearing_nfa_fees: true
  source_and_date: >
    Tradeify Help Center, "Trading Commission Fees", MNQ Micro E-Mini NASDAQ,
    Total Round Trip Cost $1.82 per contract (stated to include exchange,
    NFA, clearing and commission charges), as supplied by the rule owner;
    retrieval date 2026-09-29. Not independently verified in this repository.
  source_url: https://help.tradeify.co/en/articles/10468315-trading-commission-fees   # identified Round 16A; raw archive not yet captured
  source_access_status: ACCESS_BLOCKED_CLOUDFLARE_403   # 2026-09-30 from this environment; no search summary substituted
  source_archive_status: REQUIRED_BEFORE_EXECUTABLE   # archive URL, retrieval timestamp and content hash before ONE_CONTRACT_BACKTEST approval
  source_change_rule: A changed source page never updates these values silently; it requires a new decision and specification version.
  stress_multipliers: {BASE: "1.00", COMMISSION_STRESS_1_25X: "1.25", COMMISSION_STRESS_1_50X: "1.50"}

# --- Slippage assumptions -------------------------------------------------------------------------------------------------------------
slippage:
  # Round 15 (rule owner, 2026-09-29): candidate baseline assumptions per contract,
  # not claims about future execution. Applied after the first otherwise eligible
  # execution price is determined.
  baseline_ticks:
    entry_market: 1
    protective_stop_market: 2
    normal_time_exit_market: 2
    news_flatten_market: 2
    session_backstop_market: 3
    protection_failure_market: 3
    entry_invalidation_market: 3
    manual_safety_market: 3
    target_limit: 0   # subject to the one-tick trade-through fill rule
  adverse_direction_rule: Buys fill higher, sells fill lower by the modelled ticks.
  stress_multipliers: {BASE_SLIPPAGE: 1, DOUBLE_SLIPPAGE: 2, TRIPLE_SLIPPAGE: 3}
  actual_fill_rule: >
    Never applied twice: modelled historical fills receive modelled slippage;
    authoritative actual fills keep their actual prices, with realized
    slippage measured separately. Stress multipliers change fill prices and
    P&L only, never signals.

