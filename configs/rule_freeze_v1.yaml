# =============================================================================
#  THIS FILE IS A BLANK TEMPLATE. IT CONTAINS NO ACCEPTED TRADING RULES.
#
#  * Every `TBD` or `null` is an unanswered question, NOT a default.
#  * The software refuses to treat this file as executable until:
#      1. every required field has an explicit answer,
#      2. specification.status is FROZEN_APPROVED, and
#      3. approval_record is complete and its approved_spec_hash matches
#         the content of this file (run: `uv run mnq rules check`).
#  * Plain-English explanations of every field are in docs/RULE_FREEZE_GUIDE.md.
#  * Write clock times in quotes, e.g. "09:30". Write "NONE" or
#    "NOT_APPLICABLE" when a field deliberately does not apply; never leave it
#    empty.
#  * The list of required fields lives in src/mnq_research/validation.py, so
#    deleting a field from this file does NOT make it pass validation.
# =============================================================================

specification:
  spec_id: MNQ-RULE-FREEZE
  version: "1.0-draft"
  status: DRAFT_NON_EXECUTABLE   # allowed: DRAFT_NON_EXECUTABLE | FROZEN_APPROVED
  strategy_name: "MNQ Objective Structure Continuation — Baseline 0 (MNQ-OSC-B0)"
  author: Sam Barr               # accountable rule owner
  # Recorded verbatim from the rule owner (Round 1, 2026-09-28). This is the
  # reference description only: it is NOT executable logic. Every judgement
  # word in it is tracked in docs/RULE_FREEZE_OPEN_TERMS.md until it has an
  # exact definition in the fields below.
  plain_english_summary: >
    The strategy waits until the opening volatility has had time to develop
    and the market presents a clear, objectively measurable
    structure-continuation opportunity around meaningful price levels. It
    trades only when price demonstrates defined acceptance beyond a
    structural level, followed by sufficient confirmation that continuation
    is more likely than immediate rejection, with adequate unobstructed room
    toward the next meaningful level. Direction is chosen from the developing
    market structure: longs require bullish structural progression and
    acceptance above the relevant level, while shorts require bearish
    structural progression and acceptance below it. The strategy enters
    through a predefined order method after the confirmation trigger, places
    its stop at the structural invalidation point rather than using an
    arbitrary fixed distance, and sizes the MNQ position from that stop
    distance and the permitted account risk. It exits at a predefined target
    located conservatively before the next meaningful opposing level, at
    structural invalidation, or at a mandatory session-closing time. It takes
    no trade when conditions are unclear, data are incomplete, execution
    assumptions are unsafe, or required risk constraints cannot be satisfied.
    The exact opening delay, eligible session, structural-level definitions,
    acceptance criteria, confirmation trigger, entry order, target method,
    maximum trades, news restrictions, daily loss limit and daily shutdown
    conditions remain to be defined during Rule Freeze v1.0.

# --- Instrument and contract selection ---------------------------------------
instrument:
  root_symbol: MNQ               # stated in the project brief
  # Round 5 answers (rule owner, 2026-09-28); CME: $2 x Nasdaq-100 Index, 0.25 tick
  name: Micro E-mini Nasdaq-100 Index Futures
  exchange: CME
  venue: CME Globex
  currency: USD
  tick_size_points: 0.25
  tick_value_usd: 0.50           # = 0.25 points x $2.00 per point (checked by the validator)
  point_value_usd: 2.00
  expiration_cycle: [March, June, September, December]
  contract_selection_method: >
    Trade the designated CME lead quarterly MNQ contract under a deterministic
    calendar-based roll rule. Before the frozen roll moment, use the nearest
    unexpired quarterly contract; from the roll moment, use the following
    quarterly contract. Never select a contract by looking back at which one
    ultimately had the greatest full-day volume (future information).

# --- Contract-roll method ------------------------------------------------------
contract_roll:
  roll_trigger: >
    CME customary U.S. equity-index roll date: the Monday preceding the third
    Friday of the March, June, September or December expiration month.
  roll_timing:
    switch_at: >
      Opening of the CME Globex trading session associated with the Monday
      roll date, normally Sunday 18:00:00 America/New_York. If a holiday or
      exchange schedule changes that opening, use the actual CME-published
      Globex session opening associated with that trade date.
    example: >
      Expiration Friday September 18; roll date Monday September 14. The old
      contract stays designated through the preceding Friday session; the new
      contract becomes designated at the Sunday 18:00 New York Globex open;
      Monday 09:45 trading uses the new contract.
    manifest: The applied roll timestamp and both contract symbols are stored in the data manifest.
    boundary_rules:
      - Never combine old-contract and new-contract prices in one OHLCV bar.
      - Reset any calculation that cannot validly cross the contract boundary.
      - Any later use of prior-day or overnight levels must separately define roll-week handling.
  price_series_adjustment: >
    Unadjusted individual contracts. No back-adjusted continuous series is
    used for execution testing. Contracts are joined only by the frozen roll
    rule, with every roll transition flagged so a contract change cannot
    generate an artificial signal.
  open_position_at_roll: >
    not applicable: the strategy is intraday and must be flat before the roll
    moment (enforced by session_flattening.emergency_flatten).

# --- Source data and required fields ------------------------------------------
source_data:
  # Round 2B answers (rule owner, 2026-09-28)
  vendor: Databento   # historical research data ONLY; never in the live order path
  dataset_name: >
    Databento GLBX.MDP3, schema ohlcv-1m, individual quarterly MNQ futures
    contracts (no back-adjusted continuous series), downloaded together with
    the instrument-definition and symbology data. The actual contract symbol
    and instrument ID are preserved on every row.
  base_bar_interval: 1min        # fixed by docs/DATA_CONTRACT.md
  vendor_timestamp_convention: >
    bar_start. Databento ts_event marks the start of the minute in UTC: a bar
    stamped 13:45:00 UTC covers trades from 13:45:00 inclusive to 13:46:00
    exclusive and may not be used for a decision before 13:46:00. Databento
    prints no bar for a minute with no trades.
  vendor_timezone: UTC
  history_start_date: 2019-05-06
  history_end_date: 2026-09-25   # last fully completed trading day before this spec was written
  higher_resolution_data_available: >
    yes. Databento trades and ohlcv-1s are available. The canonical
    strategy-decision dataset remains ohlcv-1m. Higher-resolution data is for
    execution validation, ambiguous same-minute stop/target ordering,
    slippage analysis and selected replay investigations. Its complete
    history is NOT downloaded automatically: cost must be estimated and
    approved first. Until the required segment is available, the frozen
    conservative same-bar ambiguity rule applies and every affected trade is
    flagged.
  required_fields:               # fixed by docs/DATA_CONTRACT.md
    - timestamp_utc
    - timestamp_exchange
    - trading_date
    - contract
    - instrument_id
    - open
    - high
    - low
    - close
    - volume
    - source
    - source_timezone
    - ingestion_timestamp_utc

# --- Time-zone policy ------------------------------------------------------------
timezone_policy:
  storage_timezone: UTC                 # fixed by docs/DATA_CONTRACT.md
  exchange_timezone: America/Chicago    # CME local time; fixed by docs/DATA_CONTRACT.md
  rule_timezone: America/New_York   # Round 2B: session rules use New York time
  dst_handling: >
    All rule times are fixed local times in the IANA zone America/New_York all
    year: 09:45 always means 09:45 New York time in both standard and
    daylight-saving time. Convert to UTC with the time-zone database rules for
    that date; never use a fixed UTC offset such as UTC-5.

# --- Session definitions -----------------------------------------------------------
sessions:
  # Round 3 answers (rule owner, 2026-09-28).
  # Entry-eligibility window:  09:45:00 <= new-entry decision time < 11:30:00  (America/New_York)
  trading_window_start:
    time: "09:45:00"
    timezone: America/New_York
    boundary: inclusive
    anchor: 09:30:00 America/New_York cash equity-market open (NOT the 18:00 Globex open)
    meaning: >
      New entries first become eligible at 09:45:00. The last completed bar
      available to the first eligible decision is the bar stamped 09:44:00
      (covers 09:44:00 to just before 09:45:00, available at 09:45:00). No
      signal may use any part of the still-forming 09:45 bar, and no entry
      order may be submitted before 09:45:00. This establishes eligibility
      only; it never forces a trade.
  trading_window_end:
    time: "11:30:00"
    timezone: America/New_York
    boundary: exclusive
    meaning: >
      No new position or re-entry may be initiated at or after 11:30:00. With
      five-minute decisions (decision_clock) the final new-entry decision is
      at 11:25:00. A position entered before the cutoff may remain open only
      under the separately defined exit and mandatory-flattening rules.
    cutoff_semantics:   # Round 4 (rule owner, 2026-09-28)
      limits: >
        new-entry order SUBMISSION and continued entry-order ELIGIBILITY, not
        merely signal generation
      at_cutoff:
        - No new entry order may be submitted.
        - Every unfilled or partially unfilled entry order is cancelled.
        - No remaining entry quantity may fill at or after 11:30:00.
        - Protective exit orders for an existing position remain active.
        - Exit and mandatory-flattening rules are governed separately.
      entry_counts_only_if: the fill occurs strictly before 11:30:00
      late_fill_treatment: >
        An order submitted before the cutoff whose fill would occur at or
        after 11:30:00 is ineligible and is treated as CANCELLED, not filled,
        in the backtest.
      latency: >
        A decision calculated before the cutoff does not qualify unless its
        entry order is also submitted before 11:30:00. Any specified
        calculation and submission latency (decision_clock.signal_to_order_delay)
        must be modelled; a decision made just before the cutoff can never
        produce an instantaneous earlier fill.
  # reference_windows: deliberately UNRESOLVED until structural levels are
  # defined. The owner may later use overnight, prior regular session, opening
  # range, PDH, PDL, PDC or other windows, but NONE may be assumed or coded.
  # "Prior day", "overnight" and "opening range" have no assumed conventional
  # or vendor meaning: each will need an exact timezone, start boundary, end
  # boundary, inclusion rule, holiday treatment and contract-roll treatment.
  reference_windows: TBD
  early_close_handling: TBD

# --- Decision-clock timing ------------------------------------------------------------
decision_clock:
  decision_bar_interval:
    interval: 5min
    built_from: canonical one-minute bars (start-stamped, D-008)
    alignment: >
      Fixed America/New_York five-minute clock boundaries (09:30-09:35,
      09:35-09:40, 09:40-09:45, 09:45-09:50, ...). Alignment never depends on
      the historical file's first timestamp.
    membership_example: >
      The five-minute bar beginning 09:40 contains the one-minute bars
      stamped 09:40, 09:41, 09:42, 09:43 and 09:44, and is complete at 09:45.
  decision_point:
    rule: >
      New-entry decisions are made only after a five-minute bar has fully
      closed. The first eligible decision is at 09:45:00 using data through
      the completed 09:40-09:45 bar; the forming 09:45-09:50 bar is unavailable
      to it.
    eligible_new_entry_decision_times_ny: "09:45, 09:50, 09:55, ..., 11:25"
    no_decision_at: "11:30 (the entry window is end-exclusive)"
    last_decision_note: >
      A decision at 11:25 may create an entry order after the configured
      processing/submission latency; any unfilled remainder is cancelled at
      11:30:00.
    between_decisions: >
      Working orders and protective exits may be monitored continuously
      between decision times. The five-minute restriction applies only to
      generating NEW entry decisions, not to risk management or emergency
      order handling.
  signal_to_order_delay:
    value: 1.000 second from the five-minute decision-bar close to entry-order submission
    example: >
      Decision bar 09:40:00 to just before 09:45:00; decision time
      09:45:00.000; earliest submission 09:45:01.000; earliest possible fill is
      the first qualifying market event at or after 09:45:01.000. A fill at the
      09:45:00 opening trade is NOT permitted (it precedes submission).
    data_requirement: >
      Execution-grade testing requires Databento trades or one-second data
      around entries. A one-minute-only test may generate candidate signals
      but cannot claim precise execution at bar close + 1 second. Without
      higher-resolution data, flag the trade EXECUTION_AMBIGUOUS and use
      intrabar_ambiguity.fill_approximation_without_finer_data; never quietly
      assume a fill at the next minute's open.
    cutoff: If the submission time is at or after 11:30:00, the order is not submitted.
    status_note: >
      Conservative initial engineering assumption, NOT an optimised trading
      parameter. Forward testing must measure actual Quantower-to-Rithmic
      timing and stress-test longer delays without tuning them for profit.
  bar_aggregation_rule:
    decision_eligible_only_if: all five expected one-minute component bars are present and valid
    never: [forward-fill absent minutes, fabricate zero-volume bars, build a decision bar from fewer than five components]
    record_per_interval:
      - expected one-minute timestamps
      - present component count
      - missing timestamps
      - component validation status
      - final five-minute decision eligibility
    one_to_four_components_present: >
      OHLCV may be calculated and kept for diagnostics only; the bar is marked
      INCOMPLETE_NOT_DECISION_ELIGIBLE and cannot generate a new signal or
      satisfy a multi-bar setup.
    zero_components_present: >
      No synthetic OHLCV. Record an explicit NO_TRADES_OR_DATA_FOR_INTERVAL gap
      record and mark the interval ineligible.
    dependent_calculations: >
      Any indicator, market-state measurement or structural calculation that
      requires an incomplete bar is unavailable unless its own specification
      explicitly defines otherwise. The system fails closed: uncertainty
      produces no new trade.

