ema:
  included: false   # Round 15: no EMA value may affect eligibility, direction, confirmation, entry, stop, target or management
  period: TBD
  price_source: TBD
  bar_interval: TBD
  seed_method: TBD
  warmup_bars: TBD
  session_reset: TBD
  role_in_rules: TBD

# --- VWAP (only if later approved) --------------------------------------------------------------------------
# If `included` is false, the other VWAP fields are not required.
vwap:
  included: false   # Round 15: no VWAP value may affect eligibility, direction, confirmation, entry, stop, target or management
  anchor: TBD
  price_source: TBD
  volume_source: TBD
  bands: TBD
  role_in_rules: TBD

# --- Room to target (added Round 2) -----------------------------------------------------------------------
room_to_target:
  # Round 12 (rule owner, 2026-09-29); full rules in trade_geometry.
  measurement_method: >
    From the planned entry price (confirmation close + 1 tick long / - 1 tick
    short) to the planned target (one tick before the nearest boundary of the
    next distinct active zone in the direction of travel), divided by planned
    risk to the structural stop: planned_gross_rr = reward points / risk points.
  minimum_room: "planned_gross_rr >= 1.50 (equality qualifies); gross, before costs"
  obstruction_definition: >
    The next distinct active structural zone version in the direction of
    travel (same contract and trading date, not the originating zone, not
    expired or superseded) is the obstacle; it defines the target. The nearest
    such zone is always used; a nearer zone is never skipped for a more
    profitable distant one. No zone -> ROOM_TO_TARGET_UNAVAILABLE (no invented
    fixed target).

# --- Entry trigger ------------------------------------------------------------------------------------------------
entry_trigger:
  # D-029 decision 7 (rule owner, 2026-09-29).
  long_trigger: >
    A SELECTED_ENTRY_CANDIDATE with direction LONG becomes eligible for
    one MARKET entry order created at the confirmed decision timestamp and
    submitted exactly 1.000 second later, after all submission-time
    eligibility checks return typed CLEAR.
  short_trigger: >
    A SELECTED_ENTRY_CANDIDATE with direction SHORT becomes eligible for
    one MARKET entry order created at the confirmed decision timestamp and
    submitted exactly 1.000 second later, after all submission-time
    eligibility checks return typed CLEAR.
  trigger_sequence: [structure, acceptance, pullback, hold, continuation confirmation, room qualification, deterministic candidate selection, submission-time safety checks]
  not_a_trigger: [the touch, the breach, the first acceptance close, the second acceptance close alone, the retest alone, a wick through the hold bar, a discretionary command]
  terminality: >
    Each selected candidate produces at most one entry-order lifecycle: no
    retry after rejection, no replacement after expiry, no second market
    order after zero fill, no later entry from the same confirmation, no
    second entry after a partial fill. A later opportunity needs a fresh
    attempt, acceptance, confirmation and selected candidate, and remains
    subject to daily_limits.max_filled_entries_per_trading_date.

# --- Order type ----------------------------------------------------------------------------------------------------
order_type:
  # Round 13 (rule owner, 2026-09-29); full rules in entry_order_lifecycle.
  entry_order_type: MARKET
  entry_price_rule: >
    No price limit: a market order submitted 1.000 s after the decision time.
    The planned entry (confirmation close +/- 1 tick) is a planning reference
    only; the actual fill is recorded and used for all performance and R.
  prohibited_entry_order_types: [MARKET_IF_TOUCHED, LIMIT, STOP_LIMIT, STOP_MARKET]

# --- Order validity and cancellation -------------------------------------------------------------------------------
order_validity:
  # Round 13 (rule owner, 2026-09-29).
  time_in_force: >
    At most 2.000 s from submission (entry_order_max_working_seconds). The
    deadline is the EARLIEST of: submission + 2.000 s; 11:30:00 New York; a
    news entry-protection or blackout boundary; a safety halt; loss of
    reliable state; contract or session invalidation.
  cancellation_conditions: >
    At the deadline any unfilled remainder is cancelled. Never extended,
    replaced, converted to another order type or chased.

# --- Entry order lifecycle (added Round 13) -------------------------------------------------------------------
# Implemented in src/mnq_research/entry_order.py; plain English in docs/ORDER_LIFECYCLE.md.
# SIMULATION STATE MACHINE ONLY: no broker, platform, network, live or paper submission.
entry_order_lifecycle:
  parameters:   # candidate B0 values, not optimised
    entry_order_type: MARKET
    signal_to_order_delay_seconds: "1.000"   # must agree with decision_clock.signal_to_order_delay
    entry_order_max_working_seconds: "2.000"
    order_acknowledgement_timeout_seconds: "2.000"   # D-029: measured from the authoritative submission timestamp
    research_quantity_contracts: 1
  research_quantity_labels: [RESEARCH_QUANTITY_ONLY, NOT_DEPLOYMENT_SIZING]
  creation: >
    One entry order per SELECTED_ENTRY_CANDIDATE, created at the decision time,
    submitted exactly 1.000 s later. No fill can occur before submission.
  submission_recheck: >
    At the submission moment every control in execution_eligibility_integration
    is re-verified: before 11:30:00 New York; no news entry protection or
    blackout; no safety or directional-conflict halt; no daily entry halt; data
    valid; candidate not expired or used; no open position; no working entry
    order; contract and zones current. Any control not positively CLEAR ->
    no submission; the order is terminal NOT_SUBMITTED_INELIGIBLE with the
    exact reasons, and the candidate can never be reused.
  deadline: see order_validity.time_in_force; the remainder is cancelled at the deadline.
  tracked_timestamps: [order_created, order_submitted, broker_acknowledged, first_fill, final_fill, cancellation_requested, cancellation_confirmed, final_order_state]
  outcomes:
    ENTRY_FULLY_FILLED: >
      Record average fill, each individual fill, quantity, slippage versus the
      confirmation close and versus the planned entry, and latency from
      submission to first and to final fill. Actual R uses the actual fill.
    ENTRY_PARTIALLY_FILLED: >
      Accept the filled quantity; cancel the remainder; never top up; stop and
      target are not recalculated; protect immediately; halt new entries for
      the trading date. Risk uses the actual average fill, the actual quantity
      and the frozen structural stop.
    ENTRY_NOT_FILLED: No position; candidate terminal and never reused; halt new entries for the trading date.
    ENTRY_ORDER_REJECTED: No retry and no order-type change; candidate terminal; halt; record the rejection code and message.
    ENTRY_ORDER_STATE_UNKNOWN: >
      No acknowledgement (and no fill) within 2.000 s of submission, loss of
      reliable state, or contradictory reports. Never resubmit or replace;
      query order and position; no exposure increase; protect any confirmed
      position; critical alert; halt new entries for the trading date. An
      unknown state is never assumed to be a rejection.
    NOT_SUBMITTED_INELIGIBLE: >
      Terminal; exact reasons recorded; candidate never reused; no position
      and no use of the filled-entry allowance. Effect on the date depends on
      the reason (see not_submitted_effects).
  # --- D-029 confirmations (rule owner, 2026-09-29) ---
  acknowledgement_rules: >
    No acknowledgement and no other authoritative order state within 2.000 s
    of the authoritative submission timestamp -> ENTRY_ORDER_STATE_UNKNOWN.
    Exception: an AUTHORITATIVE fill record proves market receipt. Fills
    without acknowledgement -> not unknown for that reason alone; record the
    operational anomaly ACKNOWLEDGEMENT_MISSING_BUT_FILL_CONFIRMED, continue
    reconciliation, protect the confirmed position immediately, never
    resubmit. A non-authoritative local fill estimate is not proof and
    creates no exposure.
  lost_reliable_state:
    classification: ENTRY_ORDER_STATE_UNKNOWN
    causes: [CONNECTION_LOSS, ORDER_QUERY_FAILURE, POSITION_QUERY_FAILURE, STALE_STATE, PLATFORM_BROKER_DISAGREEMENT, MISSING_RECONCILIATION_IDENTIFIERS]
    fail_closed: [no duplicate entry, no replacement entry, no additional exposure, halt new entries for the date, alert and reconcile, preserve any confirmed protective order, protect any positively confirmed position]
  contradictory_reports:
    classification: ENTRY_ORDER_STATE_UNKNOWN (immutable historical event; never rewritten or deleted)
    kinds: [FILLED_MORE_THAN_SUBMITTED, FILL_AFTER_CONFIRMED_CANCELLATION, REJECTION_AND_FILL_FOR_SAME_ORDER, POSITION_DIFFERS_FROM_AUTHORITATIVE_FILLS, SIDE_OR_CONTRACT_MISMATCH, INCOMPATIBLE_TERMINAL_STATES]
    not_contradictory: A fill while cancellation is only requested or pending is a cancellation-race fill (real exposure).
  reconciliation:
    exposure_states: [RECONCILED_FLAT, RECONCILED_OPEN_POSITION, RECONCILED_PARTIAL_POSITION, RECONCILIATION_UNRESOLVED]
    rules: >
      Each reconciliation appends a new current-exposure record; the original
      anomaly and outcome stay unchanged. A reconciled position must be
      protected or flattened. Reconciliation never restores new-entry
      eligibility that trading date.
  fill_at_or_beyond_stop: >
    D-030: ANY authoritative fill at or beyond the stop (long fill price <=
    planned stop, short >= planned stop) latches emergency_flatten_required;
    later fills that improve the average never reset it, remain real, and are
    included in the emergency flatten. Then:
    keep the structural stop unchanged for audit; never move it farther; place
    no stop on the wrong side of the fill; immediately invoke emergency
    flattening of the confirmed quantity through the emergency market-close,
    retry and reconciliation rules; halt new entries for the date; record
    ENTRY_FILLED_AT_OR_BEYOND_INVALIDATION and EMERGENCY_FLATTEN_REQUIRED;
    count every fill, slippage, cost and loss. A fill on the valid side with
    more risk than planned: keep the stop and target unchanged, protect, and
    record the increased actual risk and degraded actual R:R.
  not_submitted_effects:
    temporary_known_block: Candidate terminal and not reusable; a completely fresh setup may occur after the block ends (e.g. news entry protection).
    permanent_safety_or_conflict_halt: New entries stay halted under that governing rule.
    unknown_eligibility_or_system_state: Halt new entries for the remainder of the date.
    invalid_structural_stop: >
      D-030: before submission -> do not submit; candidate terminal; halt new
      entries for the date; record INVALID_STRUCTURAL_STOP and
      PRE_SUBMISSION_SAFETY_HALT. A known, deterministic validation failure,
      never ENTRY_ORDER_STATE_UNKNOWN. Discovered after a fill -> the position
      is unprotected: emergency flatten, halt, preserve all fill and
      validation records.
  cancellation_race: >
    A fill arriving after the cancellation request is real exposure: protect
    it, reconcile order and position, and make no new entry that day.
  audit: Every outcome, including every failure, produces a deterministic audit record with its reasons and timestamps.
  protective_order_dependency:
    simulated_fill_creates: REQUIRED_PROTECTION_TASK   # quantity = confirmed position; frozen stop and target (EMERGENCY_FLATTEN_REQUIRED if the fill is at or beyond the stop)
    protective_order_layer_status: SIMULATION_IMPLEMENTED_ROUND_14   # deployment still blocked by protective_orders.deployment
    live_or_paper_order_submission: prohibited

# --- Protective stop/target orders (added Round 14) ---------------------------------------------------------
# Implemented in src/mnq_research/protection.py; plain English in docs/PROTECTIVE_ORDERS.md.
# SIMULATION ONLY: no broker, Quantower, Rithmic, paper or live connection.
protective_orders:
  parameters:   # candidate B0 values, not optimised
    protective_stop_order_type: STOP_MARKET
    profit_target_order_type: LIMIT
    protective_time_in_force: DAY
    protection_dispatch_deadline_milliseconds: 250   # operational safety requirement
    protective_order_acknowledgement_timeout_seconds: "2.000"   # separately for stop, target and OCO link
    preferred_bracket_mode: NATIVE_SERVER_SIDE_OCO_BRACKET
    target_fill_trade_through_ticks: 1
    same_bar_stop_target_policy: CONSERVATIVE_STOP_FIRST
  deployment:
    server_side_protective_orders_required: true
    server_side_oco_required: true
    capability_verification_status: REQUIRED_BEFORE_EXECUTABLE   # Quantower/Rithmic adapter and paper tests
    client_side_only_stop: INSUFFICIENT_FOR_UNATTENDED_STRATEGY
    rule: If native server-side stop/OCO behaviour cannot be verified, automated deployment remains prohibited.
  prices: >
    Unchanged from Round 12. Long: stop L - 0.25, target = next opposing zone
    lower boundary - 0.25. Short: stop U + 0.25, target = next opposing zone
    upper boundary + 0.25. Never trailed, widened, tightened, moved to
    breakeven or recalculated.
  protection_task_fields: [entry_order_id, position_id, account_id, contract, side, confirmed_open_quantity, actual_average_entry, frozen_stop_price, frozen_target_price, zone_version_id, attempt_id, acceptance_id, confirmation_id, candidate_id, first_fill_utc, protection_deadline_utc, specification_version, configuration_hash]
  dispatch: >
    Every positive authoritative entry fill creates PROTECTION_REQUIRED.
    Protective submission begins in the same event-processing cycle as the
    fill and no later than 250 ms after the fill is received; otherwise
    PROTECTION_DISPATCH_DEADLINE_MISSED, EMERGENCY_FLATTEN_REQUIRED, halt.
  bracket_workflow: >
    Preferred: NATIVE_SERVER_SIDE_OCO_BRACKET (stop and target as one atomic
    server-side unit). Otherwise, if separate server-side orders are
    supported: submit the stop, confirm it, submit the target, confirm it,
    confirm the OCO link; PROTECTION_PENDING until all checks pass. A
    client-side-only stop is insufficient. Deployment stays blocked until the
    workflow is proven not to create naked exposure or accidental reversals.
  stop_first_rule: >
    A confirmed stop without a target is temporarily risk-protected. A target
    without a stop is never acceptable: target active while the stop is
    absent, rejected, unknown or incorrect -> EMERGENCY_FLATTEN_REQUIRED.
  protection_active_definition: >
    PROTECTION_ACTIVE only after authoritative confirmation of the stop, the
    target, the OCO link, the quantities (= confirmed open quantity), the
    prices, and the side, contract and account. A local object or a
    submission request is never confirmation.
  partial_entry_fills: >
    Protect each confirmed filled quantity immediately, without waiting for
    the entry order to finish; never protect unfilled intended quantity;
    never top up. Additional entry fills raise the required protection to the
    total confirmed open quantity, with prices unchanged. If the quantity
    cannot be synchronised reliably: PROTECTION_QUANTITY_UNKNOWN,
    EMERGENCY_FLATTEN_REQUIRED.
  oco_behavior: >
    Stop and target are siblings. Full sibling fill and position flat ->
    cancel and confirm the other sibling, record the exit; it may never create
    a reverse position. Partial sibling fill -> reduce the other sibling to
    exactly the remaining open quantity, keep the OCO, never increase size or
    restore exited quantity. Reduction/cancellation not confirmed ->
    OCO_RECONCILIATION_FAILURE, emergency flatten any confirmed remainder. A
    sibling fill after the position was confirmed flat is contradictory:
    UNKNOWN, reconcile immediately, flatten any unintended exposure.
  stop_activation: >
    Research replay: a long stop-market triggers on the first authoritative
    trade <= stop (short: >= stop). The fill uses the later frozen
    stop-slippage model, never the trigger price by assumption. Live trigger
    semantics must be verified against Quantower/Rithmic behaviour.
  target_activation: >
    Research replay without queue data: a long sell-limit target needs a
    trade >= target + 0.25 (short: <= target - 0.25); a touch alone is not a
    fill. Record CONSERVATIVE_ONE_TICK_TRADE_THROUGH_TARGET_FILL. Order-level
    or queue data, if ever available, form a separate execution model.
  same_bar_ambiguity: >
    Stop and target both reachable within one minute and no finer chronology:
    assume the stop first, conservative stop fill, mark
    SAME_BAR_STOP_TARGET_AMBIGUITY and CONSERVATIVE_STOP_FIRST. One-second or
    trade data that establish order are used chronologically, keeping the
    source reference; unresolved ordering inside the finer interval falls
    back to stop-first.
  stop_failure: >
    Rejection, acknowledgement timeout, unknown state, wrong price, quantity,
    contract, account or side, cancellation without confirmed replacement,
    inactive while the position is open, or client/server disagreement ->
    halt new entries, keep the original stop for audit, begin emergency
    flattening, reconcile, critical alert; never widen or recreate strategy
    risk opportunistically.
  target_failure: >
    Stop authoritatively active but the target rejected, unknown, wrongly
    priced or sized -> halt, attempt orderly target cancellation and
    reconciliation, emergency flatten (never an unplanned stop-only
    position), keep the stop until flat is confirmed, record
    TARGET_PROTECTION_FAILURE.
  oco_link_failure: Both orders exist but the native/server-side OCO link is absent, rejected or unknown -> OCO_LINK_FAILURE, EMERGENCY_FLATTEN_REQUIRED.
  fill_at_or_beyond_stop: >
    With the D-029 emergency-flatten latch active: no normal target, no
    pretend bracket; execute the emergency-flatten workflow immediately; keep
    any safe server-side stop only until flattening is reconciled.
  flat_confirmation: >
    Flat only when authoritative position state reports quantity 0 (an exit
    fill alone is not enough). Then cancel remaining siblings, confirm their
    terminal states, mark the trade closed, keep the daily entry allowance
    consumed, continue diagnostics only.
  mandatory_session_flatten: >
    At the emergency-flatten time: cancel the target, begin controlled
    emergency flattening, keep protective stop coverage until flattening is
    authoritatively resolved where operationally safe, reconcile fills and
    orders, confirm zero position and that no sibling can reopen exposure.
    Live sequencing must be proven by adapter fault-injection tests.
  exit_outcomes: [TARGET_FILLED, STOP_FILLED, SCHEDULED_NEWS_FLATTEN, SESSION_EMERGENCY_FLATTEN, PROTECTION_FAILURE_FLATTEN, ENTRY_INVALIDATION_FLATTEN, MANUAL_SAFETY_FLATTEN, NORMAL_TIME_EXIT, MIXED_STOP_TARGET_EXIT, UNKNOWN_EXIT_STATE]
  final_flattening_legs: [STOP, TARGET, NORMAL_TIME_EXIT, NEWS_FLATTEN, SESSION_BACKSTOP, PROTECTION_FAILURE, ENTRY_INVALIDATION, MANUAL_SAFETY, OTHER, UNKNOWN]
  exit_record: >
    Every terminal record keeps actual prices, quantities, timestamps, costs
    when available, and the exit reason. D-031: every partial exit keeps its
    order ID, quantity, price, timestamp, exit type, realized P&L and the
    remaining position afterwards.
  # --- D-031 confirmations (rule owner, 2026-09-29) ---
  mixed_exits: >
    If both the stop and the target fill portions of one position, the
    outcome is MIXED_STOP_TARGET_EXIT, never named only after the final fill.
    Also record final_flattening_leg, using the most specific known value
    (Round 15): STOP, TARGET, NORMAL_TIME_EXIT, NEWS_FLATTEN,
    SESSION_BACKSTOP, PROTECTION_FAILURE, ENTRY_INVALIDATION, MANUAL_SAFETY,
    OTHER (only when no defined category fits) or UNKNOWN. Safety exits keep
    distinct labels. The complete exit-event history is always preserved.
  late_fill_after_close: >
    A sibling fill after authoritative flat confirmation changes the current
    classification to UNKNOWN_EXIT_STATE; the original close event stays
    unchanged in the immutable history. Reconcile the broker position, detect
    any unintended reverse position, flatten unintended exposure, cancel
    remaining orders, halt new entries, and record the late-fill anomaly
    separately.
  oco_link_clock: >
    Atomic bracket: starts at bracket dispatch. Stop-first workflow: starts
    when the target is authoritatively confirmed and the link can validly be
    created or verified. The link must be confirmed within 2.000 s of that
    start.
  cancellation_unknown: >
    A protective-order cancellation not confirmed within 2.000 s ->
    PROTECTIVE_ORDER_CANCELLATION_UNKNOWN; query authoritative position and
    orders; halt new entries. Position still open -> continue or invoke
    emergency flattening, keeping valid stop protection while operationally
    safe. Position already authoritatively flat -> no further flatten order;
    keep cancelling and reconciling the possibly live order; any later fill
    is unintended exposure and is flattened. Never a duplicate emergency
    market order merely because a cancellation is unknown.
  position_mismatch: >
    Any authoritative broker position disagreeing with the expected quantity,
    side, contract or account -> UNKNOWN_EXIT_STATE and
    POSITION_RECONCILIATION_REQUIRED. The broker position is treated as the
    actual exposure for safety; the disagreement is logged permanently; no
    new entry that day.

# --- Structural invalidation ------------------------------------------------------------------------------------------
structural_invalidation:
  definition: >
    Round 12: one tick beyond the far side of the complete originating zone:
    long L - 0.25, short U + 0.25 (structural_invalidation_buffer_ticks: 1).
  action: EXIT_VIA_PROTECTIVE_STOP_MARKET
  action_rules: >
    Round 15: when the stop trigger condition occurs, the existing stop-market
    lifecycle acts immediately (no waiting for a five-minute close); the stop
    is never widened or moved; no re-entry; the target is cancelled or reduced
    through the OCO process; STOP_FILLED when resolved normally.

# --- Stop placement ----------------------------------------------------------------------------------------------------
stop_placement:
  method: >
    Round 12: planned stop = structural invalidation price (long L - 0.25,
    short U + 0.25). Never compressed to fit a contract count or dollar risk.
    Not used: confirmation/retest bar extremes, fixed dollar, fixed point,
    percentage or ATR stops (only via the rule-change process).
  buffer_ticks: 1
  # Round 13 (rule owner, 2026-09-29): no fixed stop-size filter in B0.
  minimum_stop_points: NOT_APPLICABLE
  maximum_stop_points: NOT_APPLICABLE
  trade_skipped_if_outside_stop_limits: false
  stop_validity_rules:
    - Positive, finite and tick-aligned.
    - On the protective side of the planned entry and of the actual entry.
    - Derived from the correct originating zone (long L - 0.25, short U + 0.25).
    - Never resized, compressed or recalculated to fit a quantity or dollar risk.

# --- Target placement ---------------------------------------------------------------------------------------------------
target_placement:
  method: >
    Round 12: one tick before the nearest boundary of the next distinct active
    zone in the direction of travel (long: target_zone.lower_boundary - 0.25;
    short: target_zone.upper_boundary + 0.25). Must lie beyond the planned
    entry on the profitable side, otherwise the candidate is rejected.
  parameters: {target_buffer_ticks: 1, source: trade_geometry.parameters}

# --- Trade geometry (added Round 12) -----------------------------------------------------------------------
# Implemented in src/mnq_research/trade_geometry.py; plain English in docs/TRADE_GEOMETRY.md.
# Planning geometry ONLY: no order submission, fill, position size, costs or management.
trade_geometry:
  parameters:   # candidate B0 values, not optimised
    planned_entry_adverse_buffer_ticks: 1
    structural_invalidation_buffer_ticks: 1
    target_buffer_ticks: 1
    minimum_planned_gross_rr: "1.50"   # quoted: parsed as an exact decimal
    # D-028: exactly two criteria (a third, greatest reward, could never break a tie).
    candidate_ranking: [highest_planned_gross_rr, smallest_planned_risk_points]
    exact_tie_action: NO_TRADE_SAME_DIRECTION_GEOMETRY_TIE
  planned_entry_reference: >
    Long: confirmation close + 0.25; short: confirmation close - 0.25, rounded
    adversely to the tick. A deterministic planning reference for pre-trade
    geometry and candidate comparison only, never a fill; actual performance
    and R values must use the actual (simulated or live) fill recorded
    separately.
  geometry: >
    planned_risk_points = entry - stop (long) / stop - entry (short); invalid
    if <= 0. planned_reward_points = target - entry (long) / entry - target
    (short); must be > 0. planned_gross_rr = reward / risk. All prices finite,
    positive and tick-aligned; comparisons use exact decimals/fractions.
  target_zone_selection: >
    Long: active zone versions whose lower boundary is strictly above the
    planned entry, sorted by lower boundary ascending; the first is the target
    zone. Short: upper boundary strictly below the planned entry, sorted
    descending. Excluded: expired or superseded zones, the originating zone, any
    uncreated swing level, other contracts, other trading dates. "Opposing"
    means the next obstacle in the direction of travel; it need not have
    produced an opposite setup.
  cost_treatment: >
    Stop and target are never altered for costs in Round 12. Reserved and
    unresolved until the commission/slippage model is frozen:
    estimated_round_trip_cost_usd, estimated_cost_points,
    planned_net_reward_points, planned_net_rr. A gross 1.50R candidate is not
    automatically economically worthwhile.
  candidate_eligibility:
    - All direction-event identifiers match.
    - There is no daily directional-conflict halt.
    - Confirmation is executable and not expired.
    - Planned entry, stop and target are valid.
    - A distinct next opposing zone exists.
    - Planned risk is positive.
    - Planned reward is positive.
    - Planned gross R:R is at least 1.50.
    - Decision time is before 11:30.
    - No blackout, missing-data or safety halt is active.
    - Otherwise record the exact rejection reason.
  candidate_selection: >
    One room-qualified candidate -> select it. Several same-direction
    room-qualified candidates at one decision time -> rank by highest
    planned_gross_rr, then smallest planned_risk_points (D-028: nothing
    else; never reordered to prefer greater reward), using only information
    available then and exact representations. A unique best is selected. An
    exact tie on both criteria selects none:
    NO_TRADE_SAME_DIRECTION_GEOMETRY_TIE; never broken by
    processing order, zone name, level type, candidate id, dictionary or file
    order, or hypothetical later performance. The tie blocks only that
    timestamp (no daily halt); all tied confirmations become non-executable and
    cannot be reused. Lower-ranked candidates become terminal and
    non-executable with reason NOT_SELECTED_BY_GEOMETRY_RANKING (D-028); they
    can never be reused through the same confirmation, acceptance, attempt or
    zone-version/attempt identity.
  selected_candidate_record: [candidate_id, direction, decision_timestamp, confirmation_timestamp, contract, zone_version_id, attempt_id, acceptance_id, confirmation_id, target_zone_version_id, planned_entry_price, structural_invalidation_price, planned_stop_price, planned_target_price, planned_risk_points, planned_reward_points, planned_gross_rr, selection_rank_values, specification_version, configuration_hash]
  not_an_order: A SELECTED_ENTRY_CANDIDATE creates no order, quantity or fill in Round 12; Round 13 (entry_order_lifecycle) may create one simulated entry order from it.

# --- Execution eligibility integration (added D-028) ----------------------------------------------------------
# Interface: src/mnq_research/eligibility.py (ExecutionEligibility, ControlState).
execution_eligibility_integration:
  # Round 15: split by readiness stage. Historical (simulated) producers are
  # enough for research replay; live producers only for PAPER_FORWARD.
  historical_signal_producers_status: REQUIRED_BEFORE_EXECUTABLE   # SIGNAL_REPLAY: session, news, data validity, calendar availability, directional conflict, candidate validity
  simulated_execution_producers_status: REQUIRED_BEFORE_EXECUTABLE   # ONE_CONTRACT_BACKTEST: position state, filled-entry allowance, structural-stop validity, protection lifecycle, entry/exit cutoff
  live_producers_status: REQUIRED_BEFORE_EXECUTABLE   # PAPER_FORWARD only
  simulated_producers_required: [session_eligibility, news_eligibility, data_validity, position_state, daily_filled_entry_allowance, directional_conflict_halt, structural_stop_validity, candidate_validity, protection_lifecycle, entry_exit_cutoff, calendar_availability]
  unknown_state_rule: Any UNKNOWN blocks the simulated action. No live producer is required for historical replay.
  requirement: >
    News, safety, session, missing-data, directional-conflict, daily-halt,
    candidate, position, working-order, contract and zone controls must each
    produce a typed state (CLEAR / BLOCKED / UNKNOWN) that the geometry and
    entry code consume directly. Only CLEAR, verified for every control,
    permits an entry. Unknown state fails closed. Free-form strings, missing
    keys, null values or default false values can never mean "safe to trade".
  controls: [news_blackout, news_entry_protection, safety_halt, directional_conflict_halt, daily_entry_halt, filled_entry_allowance_available, session_valid, data_valid, candidate_current, no_open_position, no_working_entry_order, contract_current, zones_current]
  consumers: [trade_geometry (decision time), entry_order_lifecycle (submission recheck)]

# --- Position management ---------------------------------------------------------------------------------------------------
position_management:
  contracts_per_trade: TBD
  sizing_method: TBD
  scaling_in_out: NONE   # D-031: no scale-in, scale-out or profit lock; later only as a registered change
  breakeven_rule: NONE   # Round 14: never moved to breakeven
  trailing_stop_rule: NONE   # Round 14: never trailed, widened, tightened or recalculated
  time_based_exit: NORMAL_TIME_EXIT at normal_flatten_time (see below)
  # Round 15 (rule owner, 2026-09-29): candidate B0 parameter, not optimised.
  normal_flatten_time: "12:00:00"
  normal_flatten_timezone: America/New_York
  normal_time_exit_order_type: MARKET
  normal_time_exit_procedure: >
    At 12:00:00 New York: submit no new entry; cancel the profit target;
    begin a normal market exit for any confirmed remaining position; keep
    protective-stop coverage until closure is authoritatively resolved where
    operationally safe; reconcile position and protective orders; confirm flat
    quantity and cancelled remaining orders. Exit reason NORMAL_TIME_EXIT. If
    a news flatten, stop, target or safety exit happened earlier, no further
    normal flatten is submitted. 15:55 remains the emergency session
    backstop, not the planned exit.
  # Round 13 (rule owner, 2026-09-29): deliberately unresolved until evidence exists.
  risk_per_trade:
    status: UNRESOLVED_EVIDENCE_DERIVED
    later_formula: >
      modeled_risk_per_contract_usd = structural stop distance in points x
      2.00 USD per point + modelled slippage and costs; contracts =
      floor(allowed_planned_account_risk_usd / modeled_risk_per_contract_usd);
      contracts < 1 -> POSITION_SIZE_BELOW_ONE_CONTRACT, SKIP_TRADE. The stop
      is never compressed to make a contract fit.
  position_sizing_balance_basis: UNRESOLVED_PENDING_PROP_RULE_MODEL   # nominal 50,000 USD account size is NOT risk capital
  # D-029 decision 6 (rule owner, 2026-09-29): mechanics frozen; dollar risk still unresolved.
  # Implemented in src/mnq_research/sizing.py (not used by research simulation).
  contract_rounding: FLOOR_TO_WHOLE_CONTRACT
  below_one_contract_action: SKIP_TRADE   # records POSITION_SIZE_BELOW_ONE_CONTRACT
  sizing_never: [round up, force one contract, compress the stop, increase the allowed risk, carry fractional contracts]
  max_contracts_per_trade: TBD

# --- Trade accounting (added Round 15) ------------------------------------------------------------------------
# Implemented in src/mnq_research/accounting.py and costs.py; plain English in docs/TRADE_ACCOUNTING.md.
trade_accounting:
  gross_pnl: >
    Per fill leg. Long: (exit - entry) x 2.00 USD x quantity. Short:
    (entry - exit) x 2.00 USD x quantity. Exact fill-level accounting.
  net_pnl: >
    net_pnl_usd = gross_pnl_usd - total_commissions_usd - separately itemized
    costs. Modelled slippage is already inside modelled fill prices and is
    never subtracted again.
  commission_accounting: 0.91 USD per contract side (every entered and every exited contract), times the commission scenario multiplier.
  planned_risk: planned_risk_points and planned_risk_usd_before_costs = planned_risk_points x 2.00 x intended quantity; never mixed with actual R.
  actual_initial_risk: >
    actual_price_risk_usd = |actual average entry - structural stop| x 2.00 x
    confirmed quantity; modeled_stop_slippage_risk_usd = protective-stop
    slippage points x 2.00 x confirmed quantity; estimated_round_trip_commission_usd
    = 1.82 x confirmed quantity (x commission scenario); actual_initial_risk_usd
    = the sum of the three and must be > 0.
  result_r: result_r_net = net_pnl_usd / actual_initial_risk_usd; result_r_price_only = gross_pnl_usd / actual_price_risk_usd.
  excursions: >
    From the first authoritative entry fill to authoritative flat. Long: MFE =
    max valid traded price - actual average entry; MAE = actual average entry
    - min valid traded price (short mirrors). Never clamped to stop or target.
    Also MFE/MAE in price-only R, time to MFE, time to MAE, time in trade.
    Observations before the first fill are excluded; bar-based excursion
    timing is marked approximate.
  record_fields: [trading_date, contract, direction, identifiers, entry_legs, exit_legs, actual_average_entry, actual_average_exit, stop, target, gross_points, gross_pnl_usd, commissions_usd, net_pnl_usd, planned_risk_points, planned_risk_usd_before_costs, actual_initial_risk_usd, result_r_price_only, result_r_net, mfe_points, mae_points, mfe_r, mae_r, time_to_mfe, time_to_mae, time_in_trade, exit_reason, final_flattening_leg, slippage_scenario, commission_scenario, data_quality_flags, scorable, hashes]
  reproducibility_hashes: [specification_hash, code_hash, data_hash, calendar_hash]
  # D-033 (rule owner, 2026-09-29)
  mae_entry_minute_policy: INCLUDE_FULL_MINUTE_CONSERVATIVE
  mfe_entry_minute_policy: EXCLUDE_FULL_MINUTE_PRIMARY
  mfe_optimistic_bound_available: true
  entry_minute_rule: >
    With one-minute data, the bar containing the entry fill contributes its
    full adverse extreme to MAE (conservative), is excluded from primary MFE,
    and may be included only in a separate optimistic MFE bound; flag
    ENTRY_MINUTE_EXCURSION_APPROXIMATION. Authoritative finer data around the
    fill replace this: MAE and MFE start at the fill timestamp, no flag.
  scenario_results: >
    Every cost scenario keeps its own record, with its own commission
    multiplier inside its initial risk. BASE (BASE_SLIPPAGE with BASE
    commission) is the base-assumption result; every other combination is
    labelled HYPOTHETICAL_STRESS and never overwrites or replaces it.
  gap_trade_costs: >
    Primary unscorable gap record: only costs known to have occurred
    (normally the entry-side commission). Separate labelled full-loss stress
    record: loss exit at the stop with adverse stop slippage and a complete
    round-trip commission.

