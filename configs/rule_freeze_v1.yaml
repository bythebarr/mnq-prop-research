specification:
  spec_id: MNQ-RULE-FREEZE
  # NOTE for the transfer session: left as shipped ("1.0" passes validation - it is not TBD). Guide section 1 says the first approved complete version starts at "1.0"; changing it is a session decision, and any change must happen BEFORE the approval hash is copied (see checklist).
  version: "1.0"
  status: FROZEN_APPROVED   # allowed: FROZEN_APPROVED | FROZEN_APPROVED
  strategy_name: Archr Elite
  # Author of record and accountable for the rules (confirmed Nov 3). AI assistance is research/formalization support only, not the strategy author.
  author: Sam Barr
  plain_english_summary: The strategy waits for MNQ to interact with an objective structural zone - prior-day high, low or close; overnight high or low; or opening-range high or low - then requires price to become accepted beyond that zone, pull back and hold it, and produce a completed five-minute continuation confirmation; it trades long after confirmed acceptance above a zone and short after confirmed acceptance below, provided there is at least 1.5R of unobstructed room to the next zone. It enters once with a market order submitted one second after the confirmed decision bar closes, places the structural stop one tick beyond the opposite side of the originating zone, and targets one tick before the nearest meaningful zone ahead; if neither exit occurs, it closes at 12:00 New York time, with news, structural invalidation, data or safety failures able to force an earlier exit. New entries are allowed only from 09:45 until before 11:30 New York time, and the strategy stops entering for the day after any positive fill, an opposing-direction conflict, an unknown execution state or another safety halt.

# --- Instrument and contract selection ---------------------------------------
instrument:
  root_symbol: MNQ               # stated in the project brief
  # Execution venue is CME Globex (confirmed Nov 3).
  exchange: CME
  tick_size_points: 0.25
  tick_value_usd: 0.50
  point_value_usd: 2.00
  contract_selection_method: >
    Volume-based quarterly roll: trade the current quarterly MNQ contract until the next quarterly contract records greater completed daily volume than the current contract; switch at the following 18:00 America/New_York Globex session open, using only completed prior-day volume. The transition trading date is excluded. NOT simply 'front month'.

# --- Contract-roll method ------------------------------------------------------
contract_roll:
  roll_trigger: The next quarterly MNQ contract records greater completed daily volume than the current contract (completed prior-day volume only).
  roll_timing: At the following 18:00 America/New_York Globex session open after the trigger; the transition trading date is excluded (no trading that date).
  # UNRESOLVED: no banked answer exists - Sam never answered whether historical prices are unadjusted per-contract or a back-adjusted continuous series. The transfer session must resolve this before approval.
  price_series_adjustment: UNADJUSTED  # Gap batch Q1 (Sam, Nov 3): every bar keeps its own contract's real traded price; no adjustment/stitching; new contract's bars establish all new levels; roll-transition date excluded (frozen roll rule); roll gaps visible in audit data, never read as within-contract movement.
  open_position_at_roll: NOT_APPLICABLE - the strategy is always flat beforehand (positions flatten by 12:00 New York daily), so no open position can exist at a roll.

