# --- Time-zone policy ------------------------------------------------------------
timezone_policy:
  storage_timezone: UTC                 # fixed by docs/DATA_CONTRACT.md
  exchange_timezone: America/Chicago    # CME local time; fixed by docs/DATA_CONTRACT.md
  rule_timezone: America/New_York
  dst_handling: Rules follow New York local wall-clock time all year, automatically following daylight-saving changes; 09:45 means 09:45 in New York in both EST and EDT; UTC conversions vary by season.

# --- Session definitions -----------------------------------------------------------
sessions:
  # America/New_York. A completed five-minute decision bar closing exactly at 09:45 may produce the first eligible entry candidate (order submitted 09:45:01). Window start is inclusive.
  trading_window_start: "09:45:00"
  # America/New_York. Exclusive: no entry order may be submitted or filled at or after 11:30; any unfilled entry order is cancelled at 11:30. Separate from the 12:00 flatten of an already-open position.
  trading_window_end: "11:30:00"
  reference_windows: >
    All times America/New_York. Prior regular session: previous eligible trading day, 09:30:00 inclusive to 16:00:00 exclusive - prior-day high, low and close. Overnight session: 18:00:00 inclusive on the preceding calendar day to 09:30:00 exclusive on the trading day - overnight high and low. Opening range: 09:30:00 inclusive to 09:45:00 exclusive - opening-range high and low. The 09:25-09:30 bar is used only to initialize arming state for prior-day and overnight zones; it defines no additional measured price range.
  early_close_handling: SKIP_TRADING_DATE - early-close days are NOT eligible trading days; no trading on early-close days.

# --- Decision-clock timing ------------------------------------------------------------
decision_clock:
  decision_bar_interval: 5min, built from one-minute bars, aligned to standard five-minute America/New_York clock boundaries (e.g. 09:30-09:35), start inclusive, end exclusive.
  decision_point: Only after the completed five-minute bar closes (e.g. the 09:40-09:45 bar becomes known and may support a decision at 09:45:00 America/New_York).
  signal_to_order_delay: Exactly 1.000 second after the decision timestamp; the order is submitted only if all submission-time safety and eligibility checks still return CLEAR.

# --- Eligible trading dates ---------------------------------------------------------------
eligible_trading_dates:
  # UNRESOLVED: no banked answer exists - no batch ever specified which weekdays are tradable. (CME MNQ trades Mon-Fri, but Sam never froze a weekday list; the session must not silently adopt the guide's illustrative [MON..FRI].)
  allowed_weekdays: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY]  # Gap batch Q9 (Sam, Nov 3): CME TRADING-DATE labels, not civil dates — Sunday-evening trading belongs to Monday's trading date and may contribute to Monday's overnight levels; Saturday/Sunday trading-date labels are never eligible. Holiday, early-close, roll-transition, calendar-unknown and data-invalid exclusions apply afterward; weekday eligibility alone does not make a date tradable.
  holiday_and_half_day_policy: >
    Only eligible FULL trading days may trade: exchange holidays, early-close (half) days, excluded roll dates and calendar-unknown dates are all ineligible.
  roll_week_policy: The contract-roll transition trading date is excluded - no trading on the date the contract switch takes effect.
  # Gap batch Q10 (Sam, Nov 3): CME Group's own archived session calendar governs trading-date eligibility — the annual holiday/trading-hours calendar, Globex special-hours/holiday notices, market-regulation/operations/closure notices for exceptional halts, delayed opens or unscheduled closures, and the official CME session specifications assigning each Globex session to its trading date. Standard: preserve the original first-party file/page, source URL, retrieval timestamp and SHA-256; preserve the source's original time-zone notation, normalized to America/New_York and UTC; record parser version and the derived calendar's hash; represent regular dates, full closures, early closes, delayed opens and confirmed halts explicitly; never infer a holiday from a recurring rule or substitute a generic market calendar; an unestablishable weekday is CALENDAR_UNKNOWN and ineligible; verified closed/halted minutes are confirmed no-trade intervals, not data gaps; B0 skips full holidays, early-close dates and roll-transition dates; an intraday exceptional halt poisons the affected dependencies under the Batch 7 data policy.
  calendar_source: CME_GROUP_OFFICIAL_ARCHIVED_SESSION_CALENDAR

# --- News-event policy ----------------------------------------------------------------------
news_events:
  policy: >
    FAIL CLOSED during a scheduled-news blackout: no new entry may be created or submitted; any working entry order is cancelled at the protection cutoff; any open position is flattened with the MARKET news/safety exit process; any active approach, arm, attempt, acceptance, confirmation or selected-but-unsubmitted candidate is invalidated and becomes terminal. Bars and zone interactions during the blackout may be logged diagnostically but cannot build or preserve an executable setup. Structural levels remain available unless separately invalidated; only their live interaction state resets. At blackout end each zone resumes UNARMED; trading may resume only within the normal entry window, with every eligibility check CLEAR, after an entirely fresh arm - attempt - acceptance - pullback - hold - continuation - selection sequence. Nothing that began before or during the blackout survives across it. If an earlier trade received any fill, the daily allowance is consumed and post-blackout signals are diagnostic only. Scheduled events only; unscheduled news is not covered by this section.
  # Closed canonical list of 16. Excluded: speeches by other Fed officials, private payroll estimates, petroleum reports, auctions, earnings, unscheduled headlines, generic 'high-impact' labels. The blackout engine acts only when an event's protected interval overlaps possible B0 exposure. Every raw calendar label maps into exactly one canonical label; unrecognized or ambiguous labels remain UNKNOWN and never silently enter the blackout set.
  event_types:
    - US_EMPLOYMENT_SITUATION
    - US_CPI
    - US_PPI
    - US_INITIAL_JOBLESS_CLAIMS
    - US_GDP
    - US_PERSONAL_INCOME_AND_OUTLAYS_PCE
    - US_RETAIL_SALES
    - US_DURABLE_GOODS
    - US_JOLTS
    - US_ISM_MANUFACTURING
    - US_ISM_SERVICES
    - US_CONFERENCE_BOARD_CONSUMER_CONFIDENCE
    - US_UNIVERSITY_OF_MICHIGAN_CONSUMER_SENTIMENT
    - US_FOMC_RATE_DECISION
    - US_FOMC_PRESS_CONFERENCE
    - US_FED_CHAIR_TESTIMONY
  blackout_minutes_before: 15
  # For Fed Chair testimony the after-buffer anchors to the scheduled END (blackout = start - 15min through end + 30min).
  blackout_minutes_after: 30
  open_position_during_event: >
    Flattened with the MARKET news/safety exit process at the PROTECTION CUTOFF - exactly 15 minutes before the scheduled release - not at the release itself; at that same moment working entries are cancelled and live setup sequences are invalidated. Testimony: blackout runs scheduled start - 15 minutes through scheduled end + 30 minutes; if no authoritative scheduled end exists, the blackout fails closed through the 12:00 flatten deadline (no post-testimony entry that date); an unexpectedly early ending does not shorten the archived scheduled blackout; an officially revised schedule may be used only if published before the affected decision time and preserved in the calendar audit trail.
  calendar_source: >
    OFFICIAL_FIRST_PARTY_ARCHIVED_SCHEDULES - a first-party multi-source calendar (no single source publishes every canonical event). Mapping: BLS - Employment Situation, CPI, PPI, JOLTS; Department of Labor - Initial Jobless Claims; BEA - GDP and Personal Income and Outlays/PCE; U.S. Census Bureau - Retail Sales and Durable Goods; ISM - Manufacturing and Services; The Conference Board - Consumer Confidence; University of Michigan Surveys of Consumers - Consumer Sentiment; Federal Reserve - FOMC decision and press conference; the relevant congressional committee's official hearing notice, cross-checked against the Federal Reserve testimony archive - Fed Chair testimony start and scheduled end. Rules: use the originally scheduled date/time available before the event, never the actual publication timestamp or a retrospectively corrected listing; preserve the raw schedule/notice, source URL, retrieval timestamp, SHA-256, parser version and parsed output; preserve revisions separately with publication time and apply one only to decisions after it became public; store the source's original timestamp text plus normalized America/New_York and UTC timestamps; Eastern times follow New York DST, explicit UTC/other-zone times are converted without reinterpretation; a recurring rule such as 'first Friday' cannot replace an archived date; third-party calendars and reconstructed dates are not primary sources; if a pre-event official schedule cannot be established, the event remains UNKNOWN and the period cannot be treated as news-clear.

# --- Setup definition -----------------------------------------------------------------------------
setup:
  definition: >
    A trade becomes possible ONLY when price demonstrates confirmed structural continuation with sufficient room to the next opposing zone: an armed zone produces directional acceptance (two consecutive completed five-minute closes at least 0.50 points beyond it), followed within the confirmation window by a pullback that holds the zone and an immediate continuation bar in the same direction. The planned entry, structural stop and nearest opposing-zone target must provide at least 1.50R GROSS reward-to-risk. That creates an ELIGIBLE setup; it is not yet an order trigger until deterministic candidate selection and all submission-time checks are complete.
  preconditions:
    - The completed decision bar closes at or after 09:45 and early enough for submission and any fill to occur before 11:30 New York time
    - It is an eligible full trading day - not an exchange holiday, early-close day, excluded roll date or calendar-unknown date
    - All required structural levels and source data are valid; missing or uncertain data fail closed
    - The relevant zone is active, correctly armed and has not produced a stale, consumed or invalidated confirmation
    - The structural stop is valid and remains on the proper side of the planned entry
    - The nearest target zone exists and provides at least 1.50R of gross room
    - No position or entry order is already open or unresolved
    - The day's one-filled-entry allowance has not been consumed (any fill, full or partial, consumes it)
    - No opposite-direction conflict, execution uncertainty, data halt or safety halt has stopped the day
    - News protection, session, data, position, zone and execution-safety checks all return typed CLEAR
    - NO separate minimum-range filter, EMA/VWAP condition or extra 'minutes since open' rule beyond the 09:45 start; a zero or invalid prior-day range makes the required level calculations unavailable rather than creating a new range threshold
  setup_expiry: >
    After acceptance, confirmation must complete WITHIN SIX five-minute bars: the qualifying pullback/hold must occur BY BAR FIVE and the required continuation on the IMMEDIATELY FOLLOWING bar, NO LATER THAN BAR SIX. If the sequence fails or times out, the acceptance EXPIRES and cannot be reused. A complete setup's candidate is evaluated ONLY at its decision timestamp; if blocked, losing selection, or not producing an order, it CANNOT trigger later. Any later opportunity requires a fresh arm, attempt, acceptance and confirmation.

# --- Direction rules ----------------------------------------------------------------------------------
direction:
  long_conditions:
    - A valid structural zone with lower boundary L and upper boundary U is armed from below
    - A later touch or qualifying upward gap starts an upward attempt
    - Price becomes accepted above the zone: two consecutive completed five-minute closes at or above U + 0.50 points
    - Within the confirmation clock, a pullback bar retests the accepted zone, trades no lower than L, and closes holding above it (trading one tick below L FAILS the long setup)
    - The immediately following five-minute bar confirms continuation by closing at least one tick above the pullback/hold bar's high
    - Planned entry (confirmation close plus one adverse tick), structural stop one tick below L, and target one tick before the nearest zone above provide at least 1.50R
    - If multiple long candidates exist simultaneously, this candidate wins the ranking: highest R:R, then smallest risk; an exact tie means NO trade
    - Every news, session, data, position, zone and execution-safety check is CLEAR, with no open position, prior fill or daily halt
    - The selected candidate creates one market-order lifecycle at the confirmation-bar close, submitted exactly 1.000 second later
  short_conditions:
    - A valid structural zone with lower boundary L and upper boundary U is armed from above
    - A later touch or qualifying downward gap starts a downward attempt
    - Price becomes accepted below the zone: two consecutive completed five-minute closes at or below L - 0.50 points
    - Within the confirmation clock, a pullback bar retests the accepted zone, trades no higher than U, and closes holding below it (trading one tick above U FAILS the short setup)
    - The immediately following five-minute bar confirms continuation by closing at least one tick below the pullback/hold bar's low
    - Planned entry (confirmation close minus one adverse tick), structural stop one tick above U, and target one tick before the nearest zone below provide at least 1.50R
    - If multiple short candidates exist simultaneously, this candidate wins the ranking: highest R:R, then smallest risk; an exact tie means NO trade
    - Every news, session, data, position, zone and execution-safety check is CLEAR, with no open position, prior fill or daily halt
    - The selected candidate creates one market-order lifecycle at the confirmation-bar close, submitted exactly 1.000 second later
  conflict_resolution: >
    If valid long and short confirmations complete at the SAME decision timestamp: NO trade, and a DIRECTIONAL-CONFLICT SAFETY HALT applies for the rest of that trading date. Neither side wins by ranking, order of processing, reward-to-risk or proximity. Diagnostic signals may still be recorded, but no entry may be submitted later that day. This also applies if the conflict completes during the pre-09:45 replay.

# --- Structural level definitions -------------------------------------------------------------------------
structural_levels:
  # Closed list of exactly seven. Explicitly NOT used: swing highs/lows, EMA levels, VWAP, pivots, volume profile, Fibonacci levels, discretionary support/resistance.
  level_types:
    - Prior regular-session high
    - Prior regular-session low
    - Prior regular-session close
    - Overnight-session high
    - Overnight-session low
    - Opening-range high
    - Opening-range low
  calculation_method: >
    All levels are calculated from valid one-minute bars in America/New_York time; five-minute decision bars are not used to calculate level prices. Prior regular-session high: maximum one-minute high over the previous eligible regular session (09:30 inclusive to 16:00 exclusive). Prior regular-session low: minimum one-minute low over the same window. Prior regular-session close: close of the final valid one-minute bar in that window (normally the 15:59-16:00 bar); if the final bar is absent, the configured staleness and verified-no-trade requirements must be satisfied, otherwise the close is unavailable. Overnight high/low: maximum high / minimum low from 18:00 inclusive on the preceding calendar day to 09:30 exclusive on the trading day. Opening-range high/low: maximum high / minimum low from 09:30 inclusive to 09:45 exclusive. Missing bars are never synthesized or forward-filled; if unexplained missing data prevents validating a required window, the affected level is UNAVAILABLE. Nearby raw levels merge into one structural zone when their distance is within 2% of the prior regular-session range, clamped between 2 and 10 points (threshold = min(max(0.02 x prior range, 2), 10)).
  level_expiry: A level remains valid for the entire trading date; it does not expire merely because it is touched, breached, accepted or tested multiple times. Its interaction state may reset and require a fresh arm/attempt, but the underlying level remains available. All levels expire at the end of that trading date and are recalculated for the next eligible date. The preliminary opening-range version used during the 09:30-09:45 replay is replaced by the final opening-range level at 09:45. A level can become unavailable earlier only if its source data, contract, calendar status or calculation is found invalid or uncertain. For actual entries, every otherwise-valid level becomes non-actionable once the 11:30 entry cutoff arrives.
  level_proximity_tolerance: >
    Approaching/testing: price's WICK comes within 6.00 MNQ points (24 ticks) of the nearest zone boundary. A touch requires the wick to reach that boundary or trade inside the zone; there is no additional touch tolerance beyond the boundary itself. Proximity/touch are judged on wicks, not closes. (Zone merging is a separate mechanism - see calculation_method.)

# --- Acceptance, rejection and breakout definitions ---------------------------------------------------------
acceptance_rejection_breakout:
  measurement_basis: >
    Measured on completed five-minute decision bars: approach, touch and breach are judged using the bar's high and low (wicks) against zone boundaries; acceptance is judged using five-minute closes, requiring the configured consecutive closes beyond the far boundary; rejection is judged primarily using five-minute closes after a directional touch or qualifying gap attempt - wicks establish the interaction, closing location determines whether the attempt was rejected. Breakout is not a separate event in B0; it is identical to confirmed acceptance beyond the zone.
  acceptance_definition: >
    For a zone with lower boundary L and upper boundary U: acceptance ABOVE - after an armed upward attempt begins with a touch or qualifying gap - requires TWO consecutive completed five-minute closes at or above U + 0.50 points (two MNQ ticks beyond the zone). Acceptance BELOW - after an armed downward attempt - requires TWO consecutive completed five-minute closes at or below L - 0.50 points. A wick beyond the zone is only a breach; it is NOT acceptance. Breakout and acceptance are the same event in B0. The later pullback, hold and continuation bar are confirmation AFTER acceptance, not part of it.
  rejection_definition: >
    TWO separate rejection rules, deliberately kept apart. (A) Attempt-phase rejection, close-based, threshold 0.50 points: during the attempt's THREE-BAR rejection window, an upward attempt is rejected if price fails to establish acceptance above AND a completed five-minute bar closes back on the originating lower side of the zone at or below L - 0.50; a downward attempt is rejected if a completed five-minute bar closes at or above U + 0.50. Equality qualifies. An attempt must first be legitimately ARMED and begin with a touch or qualifying gap. If the three-bar window expires without a rejection, the attempt is NOT retroactively called rejected (acceptance may still occur later). (B) Post-acceptance pullback/confirmation failure, wick-based, threshold exactly one MNQ tick (0.25 point) through the zone's far boundary: a long pullback whose low is at or below L - 0.25 rejects and FAILS the setup; a short pullback whose high is at or above U + 0.25 rejects and fails the setup. Equality qualifies; merely touching L (long) or U (short) does not fail. The current attempt, acceptance and confirmation sequence become terminal and cannot be reused. The zone is NOT killed for the day: it returns to UNARMED status and requires a fresh clear-side close, new attempt, new acceptance and new confirmation. Any actual fill still consumes the daily entry allowance, so rearming matters only when the rejected setup never produced a fill. Rationale (Sam): the 0.25 wick threshold fails a vulnerable pending setup, while the 0.50 close threshold classifies the earlier attempt as rejected - a single noisy wick must not create a close-based rejection label.
  breakout_definition: In B0, breakout is NOT a separate event from acceptance. A breakout ABOVE means an armed upward attempt produces two consecutive completed five-minute closes at or above U + 0.50 points (two ticks beyond the zone's upper boundary); a breakout BELOW requires the mirrored two closes at or below L - 0.50. A wick or single close beyond the zone is only a breach or partial acceptance sequence - NOT a breakout. The later pullback, hold and continuation bar are confirmation AFTER the breakout/acceptance, not part of it.

